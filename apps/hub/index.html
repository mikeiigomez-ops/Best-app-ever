<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: folded = one column + bottom tab bar; opened = decision queue on the left screen, detail pane on the right (hinge-aware). */
:root{
  --bg:#eef1f6; --panel:#ffffff; --sunk:#e3e8f0; --line:#cfd6e2;
  --fg:#18202e; --muted:#5a6578; --accent:#2b4fd8; --accent-ink:#ffffff;
  --good:#1f7a4d; --good-bg:#dff2e7; --warn:#9a5b00; --warn-bg:#fbecd2; --bad:#b4233a; --bad-bg:#f9dfe3;
  --info-bg:#e2e8fc;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --tabh:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141d; --panel:#171e2b; --sunk:#1d2636; --line:#2b3649;
  --fg:#e7ecf5; --muted:#97a3b8; --accent:#8aa2ff; --accent-ink:#0f141d;
  --good:#6fd39c; --good-bg:#173527; --warn:#f2b45a; --warn-bg:#3a2b13; --bad:#ff8a9b; --bad-bg:#3d1a22;
  --info-bg:#1f2a4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141d; --panel:#171e2b; --sunk:#1d2636; --line:#2b3649;
  --fg:#e7ecf5; --muted:#97a3b8; --accent:#8aa2ff; --accent-ink:#0f141d;
  --good:#6fd39c; --good-bg:#173527; --warn:#f2b45a; --warn-bg:#3a2b13; --bad:#ff8a9b; --bad-bg:#3d1a22;
  --info-bg:#1f2a4a; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px));
  max-width:1400px;margin:0 auto;
}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:4px 12px}
.brand h1{font-size:1.45rem;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.err{background:var(--bad)}
.refresh{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer}

.pane{display:flex;flex-direction:column;gap:14px;min-width:0}
.pane[hidden]{display:none!important}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.section-h h2{font-size:1.15rem}
.section-h .sub{color:var(--muted);font-size:.84rem}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat b{display:block;font:600 1.5rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted);letter-spacing:.02em}
.stat.alert b{color:var(--bad)}

/* decision items */
.queue{display:flex;flex-direction:column;gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item.urgent{border-left:4px solid var(--bad)}
.item.session{border-left:4px solid var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.76rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;letter-spacing:.02em;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.info{background:var(--info-bg);color:var(--accent)}
.item p{margin:0;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 12px;min-height:44px;font-size:.86rem;font-weight:700;cursor:pointer}
.btn.do{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.decided{opacity:.75}
.decided .acts{display:none}
.undo{background:none;border:0;color:var(--accent);cursor:pointer;font-size:.8rem;padding:4px 0;text-decoration:underline}
.reply{display:flex;flex-direction:column;gap:6px}
.reply textarea{width:100%;box-sizing:border-box;min-height:72px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:8px 10px;font:inherit;resize:vertical}
.note{font-size:.8rem;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:.9rem;background:transparent}
details.done-list summary{cursor:pointer;color:var(--muted);font-size:.86rem;padding:6px 0}
details.done-list .queue{margin-top:8px}

/* filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:.82rem;white-space:nowrap;cursor:pointer;min-height:36px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* reports */
.report{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.report .lead{font-weight:700;font-size:1rem;margin:0}
.report h4{margin:8px 0 0;font:600 .82rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.report ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.report li{overflow-wrap:anywhere}
.report details summary{cursor:pointer;color:var(--accent);font-size:.86rem}

/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.proj h3{font-size:1.02rem}
.proj p{margin:0;color:var(--muted);font-size:.88rem}
.proj ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.proj li a{display:block;padding:7px 0;border-top:1px solid var(--line);text-decoration:none;font-size:.9rem}
.proj li:first-child a{border-top:0}

/* sessions */
.sess{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sess .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sess .t a{font-weight:700;text-decoration:none;color:var(--fg);overflow-wrap:anywhere}
.sess p{margin:0;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.group-h{font:600 .8rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.sched{display:flex;flex-direction:column;gap:6px}
.sched div{display:flex;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;flex-wrap:wrap}

/* folded: bottom tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{height:var(--tabh);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;line-height:18px;padding:0 5px;font-family:var(--f-mono)}
.badge[hidden]{display:none}
.wide-tabs{display:none}

/* opened: two panes */
@media (min-width:640px){
  .app{display:grid;grid-template-columns:minmax(300px,0.9fr) minmax(0,1.3fr);grid-template-rows:auto 1fr;column-gap:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .top{grid-column:1/-1}
  .tabs{display:none}
  #pane-today{display:flex!important;grid-column:1;grid-row:2}
  .right{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:14px;min-width:0}
  .wide-tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .wide-tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:.86rem;color:var(--muted);cursor:pointer;min-height:40px}
  .wide-tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  #pane-today .queue{max-height:none}
}
@media (max-width:639.98px){ .right{display:contents} }
/* dual-segment screens: snap the two panes to the two segments and keep content off the hinge */
@media (horizontal-viewport-segments:2){
  .app{max-width:none;grid-template-columns:calc(env(viewport-segment-width 0 0) - max(16px,env(safe-area-inset-left,0px))) 1fr;
    column-gap:calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0) + 24px)}
}
@media (prefers-reduced-motion:no-preference){ .item,.report,.sess{transition:opacity .2s} }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Command Deck</h1>
      <p id="today-line">Projects, bot reports and next steps</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">

      <button class="refresh" id="refresh" type="button">Refresh</button>

  </header>

  <section class="pane" id="pane-today" aria-labelledby="h-today">
    <div class="section-h"><h2 id="h-today">Decide next</h2><span class="sub" id="today-sub"></span></div>
    <div class="strip">
      <div class="stat" id="st-open"><b>0</b><span>Steps to decide</span></div>

      <div class="stat" id="st-today"><b>0</b><span>Picked for today</span></div>

  <div class="right">

      <button role="tab" data-tab="projects" aria-selected="false" id="wt-projects">Projects</button>
      <button role="tab" data-tab="sessions" aria-selected="false" id="wt-sessions">Sessions</button>
    </nav>

    <section class="pane" id="pane-reports" hidden aria-labelledby="h-rep">
      <div class="section-h"><h2 id="h-rep">Bot reports</h2><span class="sub" id="rep-sub"></span></div>

    <section class="pane" id="pane-projects" hidden aria-labelledby="h-proj">

      <div class="grid" id="projects"></div>

    <section class="pane" id="pane-sessions" hidden aria-labelledby="h-sess">
      <div class="section-h"><h2 id="h-sess">Claude sessions</h2><span class="sub" id="sess-sub"></span></div>
      <div id="sessions" class="queue"></div>
      <div class="group-h">Scheduled bots</div>
      <div class="sched" id="sched"></div>
    </section>
  </div>
</div>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="today" aria-selected="true" id="t-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg>Decide<span class="badge" id="b-today" hidden></span></button>
  <button role="tab" data-tab="reports" aria-selected="false" id="t-reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h4"/></svg>Reports</button>
  <button role="tab" data-tab="projects" aria-selected="false" id="t-projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Projects</button>
  <button role="tab" data-tab="sessions" aria-selected="false" id="t-sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg>Sessions<span class="badge" id="b-sess" hidden></span></button>
</nav>

<script>
(() => {
const A = "https://claude.ai/artifact/";
const PROJECTS = [
  {name:"BY ALONDRA", blurb:"Live embroidery business: bot floor, site, products and contracts.", keys:["alondra","embroider","mini totes","se700","brother","stitch","digitiz","matilde","shoppers"],
   links:[["Bot Floor","JYJkaqayBh4AQCJ3jJtNES"],["Growth Plan","BFWZ51xdkM46R5TcARmVU6"],["Overhaul Plan","6G2ZvoNJnFNeQzQyCKCD6h"],["Product Page","4WLM32RcMfxyjgwhwiQgJv"],["Personalizer, Five Ways","43ZrFxuSwEJkUWAp19Mjm5"],["Stitch Composer","CEeCnTANat74HWSK7SYffK"],["Thread and Pixel","5AALMWMef1oWftdLFaAggt"],["Digitizer Desk Layout","BvWwrpLL6jZ7PAD9rSAHgX"],["Shoppers On The Sign","CeXpZNqcGJ6r1zja1XY8N5"],["Wedding Live Embroidery Agreement","UhXtVLLneqidXjz6V1KwEx"]]},
  {name:"Live Vendor OS", blurb:"Event checkout and vendor tools: MVP, audits and rollout.", keys:["vendor os","vendor"],
   links:[["Build-Out","GDDAA12DpKDskUA845gyha"],["First Vendor Runbook","WULSwHtSSS4Y3sasGimveT"],["Interface Review","Xn9hyBRCYJ5EKLThLmFCXa"],["Audit","NJFmupf7czhismVT79F9eS"],["Rollout","AjsYYKfbwABVj6KfX1wEDD"],["Capabilities","A4eY9TRY22Lt5gyAKymqMV"],["Teardown","Km6BNZTXJCQt354VTDc4bo"]]},
  {name:"SprintRay WFM", blurb:"Workforce dashboards and the hosting proposal.", keys:["sprintray","wfm","callers"],
   links:[["Dashboard","X5pm3YGajofQx7XZZfGPay"],["Executive Dashboard","AdBE4rQbSbrRzwXsdVe2vt"],["My day, for CS agents","M9WM4jN8eJaKcsNKiHXUkW"],["IT Review and Hosting Proposal","NwyLGm8ZpuqqTciFADVCAw"],["Why Callers Hang Up","HAU3hxSpJnE1X5APWNpebu"]]},
  {name:"Apps and games", blurb:"Best-app-ever repo: feed, word games and family play.", keys:["web app","family","spellbright","letterfall","upscroll","testament","video visibility","iphone","productivity"],
   links:[["Upscroll","WsJJXrhHC5G8GWowL3HcSA"],["Spellbright","L6utaJ26ovk8QCpyF5qA1a"],["Letterfall Swap Edition","KtcKoJXBmtZzMDnVRpjgZ8"],["The Emmaus Road","Uez4gv1UVeuPJMsRWHP5SY"],["Workbench","RuqdniAGzxNaUayLz55MZs"],["Twenty Laws, One Screen","SaX2JyWYUSAdR4f3byPsKr"]]},
  {name:"Gomez family", blurb:"Family hub art direction and breathing room.", keys:["gomez"],
   links:[["Breathing Room","VXyDRAiZJPRc46GQHUS2LQ"],["Art Style Test","HwLCjgSEj2rLM1emcDWa6Q"],["Hub Art Brief","KiMiVCPbGFusDuuuTP2P4N"]]},
  {name:"Ventures and proposals", blurb:"MicroTanda, Mendpool, ReadyUnit and the videography site.", keys:["microtanda","mendpool","readyunit","videography","makerspace"],
   links:[["MicroTanda Credit Union Proposal","JCXqEAvV9jcvSkyiSxm77y"],["MicroTanda Pitch and Roadmap","QMGAUB6vakRaioaL3j8wug"],["Mendpool Vision","1tCL4k49nkxbE3qwmPNQEe"],["Mendpool Operating Plan","3SFxw6e7ZUr2MXX3JY4mco"],["ReadyUnit Demo","VuSD8Hxjm8Hs9NJwhqoDEn"]]},
];
const BOTS = {bookings:"Bookings & Leads",production:"Orders & Production",social:"Social & Content",shop:"Shop & Pricing",activations:"Events & Activations",seo:"SEO & Website"};
const BUCKETS = [
  ["SESSION_STATUS_BUCKET_BLOCKED","Waiting on you","bad"],
  ["SESSION_STATUS_BUCKET_REVIEW_READY","Ready to review","info"],
  ["SESSION_STATUS_BUCKET_WORKING","Working","warn"],
  ["SESSION_STATUS_BUCKET_FAILED","Failed","bad"],
  ["SESSION_STATUS_BUCKET_COMPLETED","Done","good"],
];
const TZ = "America/Detroit";
const CCR = "Claude Code Remote";

const S = {reports:[], decisions:{}, dbState:"loading", sessions:null, sessErr:null, triggers:null, trigErr:null, canReply:false, tab:"today", rightTab:"reports", bot:"all", showArchived:false, replying:{}};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const fmtDay = iso => { try { return new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric"}).format(new Date(iso)); } catch { return ""; } };
const fmtTime = iso => { try { return new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(new Date(iso)); } catch { return ""; } };
const ago = iso => { const m=(Date.now()-new Date(iso))/6e4; if(!isFinite(m))return""; if(m<60)return Math.max(1,Math.round(m))+"m ago"; if(m<1440)return Math.round(m/60)+"h ago"; return Math.round(m/1440)+"d ago"; };
const dkey = () => new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date());
const hash = s => { let h=5381; for (const c of s) h=((h*33)^c.charCodeAt(0))>>>0; return h.toString(36); };

/* ---------- parse a bot report ---------- */
function parseReport(text){
  const lines = String(text||"").split(/\n/).map(l=>l.trim()).filter(Boolean);
  const lead = lines.shift() || "";
  const sections=[]; let cur={h:"",items:[]};
  for (const l of lines){
    const m = l.match(/^\*\*(.+?)\*\*:?$/);
    if (m){ if(cur.items.length||cur.h) sections.push(cur); cur={h:m[1],items:[]}; }
    else cur.items.push(l.replace(/^[-•]\s*/,""));
  }
  if(cur.items.length||cur.h) sections.push(cur);
  return {lead, sections};
}

/* ---------- decision items ---------- */
function buildItems(){
  const items=[];
  // latest report per bot
  const latest={};
  for (const r of S.reports){ const b=r.bot||"other"; if(!latest[b] || (r.createdAt||"")>(latest[b].createdAt||"")) latest[b]=r; }
  for (const b of Object.keys(latest)){
    const r=latest[b], p=parseReport(r.text);
    for (const sec of p.sections){
      if (/since yesterday/i.test(sec.h)) continue;
      sec.items.forEach(t=>{
        if (/^still open\b/i.test(t) || /^nothing was fixed/i.test(t)) return;
        const urgent=/\b(today|overdue|tomorrow)\b/i.test(t) || /^today:/i.test(t);
        items.push({id:"r-"+hash(r._id+"|"+t), kind:"report", bot:b, text:t, when:r.createdAt, urgent, section:sec.h});
      });
    }
  }
  if (Array.isArray(S.sessions)) for (const s of S.sessions){
    const need=s.post_turn_summary?.needs_action;
    if (need && s.status_bucket==="SESSION_STATUS_BUCKET_BLOCKED" && s.session_status!=="SESSION_STATUS_ARCHIVED")
      items.push({id:"s-"+s.id, kind:"session", session:s, text:need, when:s.updated_at, urgent:false});
  }
  const rank = i => (i.kind==="session"?0:i.urgent?1:2);
  items.sort((a,b)=>rank(a)-rank(b) || String(b.when).localeCompare(String(a.when)));
  return items;
}

const CHOICES = {today:["Do today","good"], later:["Later","warn"], skip:["Skip",""], done:["Done","good"]};
function itemHTML(it){
  const d=S.decisions[it.id];
  const src = it.kind==="session"
    ? `<span class="chip warn">Session</span><a href="https://claude.ai/code/${esc(it.session.id)}" target="_blank" rel="noopener">${esc(it.session.title||"Untitled")}</a>`
    : `<span class="chip">${esc(BOTS[it.bot]||it.bot)}</span><span>${esc(it.section||"")}</span>`;
  const urgent = it.urgent && !d ? `<span class="chip bad">Due soon</span>` : "";
  const when = it.when ? `<span class="mono">${esc(fmtDay(it.when))}</span>` : "";
  const state = d ? `<span class="chip ${CHOICES[d.choice]?.[1]||""}">${esc(CHOICES[d.choice]?.[0]||d.choice)}</span>` : "";
  let acts = `<div class="acts">
      <button class="btn do" data-act="today" data-id="${it.id}" type="button">Do today</button>
      <button class="btn" data-act="later" data-id="${it.id}" type="button">Later</button>
      <button class="btn ghost" data-act="skip" data-id="${it.id}" type="button">Skip</button>`;
  if (it.kind==="session" && S.canReply) acts += `<button class="btn" data-act="reply" data-id="${it.id}" type="button">Answer</button>`;
  acts += `</div>`;
  const reply = (it.kind==="session" && S.replying[it.id]) ? `<div class="reply">
      <label class="note" for="rp-${it.id}">Your answer goes to that session as a message.</label>
      <textarea id="rp-${it.id}" data-draft="${it.id}">${esc(S.replying[it.id].text||"")}</textarea>
      <div class="acts"><button class="btn do" data-act="send" data-id="${it.id}" type="button" ${S.replying[it.id].busy?"disabled":""}>${S.replying[it.id].busy?"Sending…":"Send answer"}</button>
      <button class="btn ghost" data-act="cancel" data-id="${it.id}" type="button">Cancel</button></div>
      ${S.replying[it.id].msg?`<div class="note">${esc(S.replying[it.id].msg)}</div>`:""}</div>` : "";
  const doneBtn = d && d.choice==="today" ? `<button class="undo" data-act="done" data-id="${it.id}" type="button">Mark done</button> · ` : "";
  return `<article class="item ${it.kind==="session"?"session":it.urgent&&!d?"urgent":""} ${d?"decided":""}">
    <div class="meta">${src}${urgent}${when}${state}</div>
    <p>${inline(it.text)}</p>
    ${d ? `<div>${doneBtn}<button class="undo" data-act="undo" data-id="${it.id}" type="button">Undo</button></div>` : acts}
    ${reply}
  </article>`;
}

function renderToday(){
  const items=buildItems();
  const open=items.filter(i=>!S.decisions[i.id]);
  const picked=items.filter(i=>S.decisions[i.id]?.choice==="today");
  const rest=items.filter(i=>S.decisions[i.id] && S.decisions[i.id].choice!=="today");
  $("st-open").querySelector("b").textContent=open.length;
  const blocked = Array.isArray(S.sessions) ? S.sessions.filter(s=>s.status_bucket==="SESSION_STATUS_BUCKET_BLOCKED"&&s.session_status!=="SESSION_STATUS_ARCHIVED").length : null;
  const sb=$("st-blocked"); sb.querySelector("b").textContent = blocked==null?"–":blocked; sb.classList.toggle("alert", !!blocked);
  $("st-today").querySelector("b").textContent=picked.length;
  const bt=$("b-today"); bt.hidden=!open.length; bt.textContent=open.length;
  const bs=$("b-sess"); bs.hidden=!blocked; bs.textContent=blocked||"";

  let html="";
  if (picked.length) html += `<div class="group-h">Today</div>` + picked.map(itemHTML).join("");
  if (open.length) html += `<div class="group-h">To decide</div>` + open.map(itemHTML).join("");
  if (!items.length){
    html = S.dbState==="loading" ? `<div class="empty">Loading your bot reports…</div>`
      : S.dbState==="off" ? `<div class="empty">Open this page in Claude to load your bot reports and saved decisions.</div>`
      : `<div class="empty">No next steps yet. Bot reports arrive weekday mornings at 6:37 AM, and the site review runs daily at 6:14 AM.</div>`;
  } else if (!open.length && !picked.length) html = `<div class="empty">Everything is decided. New steps arrive with the next bot run.</div>`;
  $("queue").innerHTML=html;
  $("done-wrap").hidden=!rest.length;
  $("done-sum").textContent=`Decided (${rest.length})`;
  $("done").innerHTML=rest.map(itemHTML).join("");
  const latest=S.reports.reduce((m,r)=>(r.createdAt||"")>m?r.createdAt:m,"");
  $("today-sub").textContent = latest ? "From reports through "+fmtDay(latest) : "";
}

function renderReports(){
  const bots=["all",...Object.keys(BOTS).filter(b=>S.reports.some(r=>r.bot===b))];
  $("bot-filters").innerHTML=bots.map(b=>`<button type="button" data-bot="${b}" aria-pressed="${S.bot===b}">${esc(b==="all"?"All bots":BOTS[b])}</button>`).join("");
  const list=S.reports.filter(r=>S.bot==="all"||r.bot===S.bot).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  $("rep-sub").textContent = list.length ? `${list.length} report${list.length>1?"s":""}` : "";
  if(!list.length){ $("reports").innerHTML=`<div class="empty">${S.dbState==="off"?"Open this page in Claude to see reports.":"No reports yet."}</div>`; return; }
  const latestDay = {};
  list.forEach(r=>{ const k=(r.createdAt||"").slice(0,10); if(!latestDay[r.bot]||k>latestDay[r.bot]) latestDay[r.bot]=k; });
  $("reports").innerHTML=list.slice(0,40).map(r=>{
    const p=parseReport(r.text); const fresh=(r.createdAt||"").slice(0,10)===latestDay[r.bot];
    const body=p.sections.map(s=>`${s.h?`<h4>${inline(s.h)}</h4>`:""}${s.items.length?`<ul>${s.items.map(i=>`<li>${inline(i)}</li>`).join("")}</ul>`:""}`).join("");
    return `<article class="report">
      <div class="meta"><span class="chip ${fresh?"info":""}">${esc(BOTS[r.bot]||r.bot)}</span><span class="mono">${esc(fmtTime(r.createdAt))}</span></div>
      <p class="lead">${inline(p.lead)}</p>
      ${fresh?body:`<details><summary>Show full report</summary>${body}</details>`}
    </article>`;
  }).join("");
}

function sessionsFor(p){
  if(!Array.isArray(S.sessions)) return [];
  return S.sessions.filter(s=>{ const t=(s.title||"").toLowerCase(); return p.keys.some(k=>t.includes(k)); });
}
function renderProjects(){
  $("projects").innerHTML=PROJECTS.map(p=>{
    const ss=sessionsFor(p);
    const waiting=ss.filter(s=>s.status_bucket==="SESSION_STATUS_BUCKET_BLOCKED"&&s.session_status!=="SESSION_STATUS_ARCHIVED").length;
    const chips = Array.isArray(S.sessions) ? `<div class="meta"><span class="chip">${p.links.length} artifacts</span><span class="chip">${ss.length} sessions</span>${waiting?`<span class="chip bad">${waiting} waiting on you</span>`:""}</div>` : `<div class="meta"><span class="chip">${p.links.length} artifacts</span></div>`;
    return `<article class="proj"><h3>${esc(p.name)}</h3><p>${esc(p.blurb)}</p>${chips}
      <ul>${p.links.map(([t,id])=>`<li><a href="${A}${id}" target="_blank" rel="noopener">${esc(t)} ↗</a></li>`).join("")}</ul></article>`;
  }).join("");
}

function renderSessions(){
  const el=$("sessions");
  if (S.sessErr){ el.innerHTML=`<div class="empty">${esc(S.sessErr)}</div>`; }
  else if (!Array.isArray(S.sessions)){ el.innerHTML=`<div class="empty">Loading your sessions…</div>`; }
  else {
    const vis=S.sessions.filter(s=>S.showArchived||s.session_status!=="SESSION_STATUS_ARCHIVED");
    let html="";
    for (const [b,label,tone] of BUCKETS){
      const g=vis.filter(s=>s.status_bucket===b); if(!g.length) continue;
      html+=`<div class="group-h">${label} · ${g.length}</div>`+g.map(s=>{
        const sum=s.post_turn_summary?.needs_action||s.post_turn_summary?.recent_action||"";
        return `<article class="sess"><div class="t"><a href="https://claude.ai/code/${esc(s.id)}" target="_blank" rel="noopener">${esc(s.title||"Untitled session")}</a>
          <span class="chip ${tone}">${label}</span></div>
          ${sum?`<p>${s.post_turn_summary?.needs_action?"<strong>Needs:</strong> ":""}${esc(sum)}</p>`:""}
          <div class="meta"><span class="mono">${esc(ago(s.updated_at))}</span>${s.session_status==="SESSION_STATUS_ARCHIVED"?'<span class="chip">Archived</span>':""}${s.unread?'<span class="chip info">Unread</span>':""}</div></article>`;
      }).join("");
    }
    const arch=S.sessions.filter(s=>s.session_status==="SESSION_STATUS_ARCHIVED").length;
    if(arch) html+=`<button class="undo" id="toggle-arch" type="button">${S.showArchived?"Hide":"Show"} ${arch} archived</button>`;
    el.innerHTML=html||`<div class="empty">No sessions yet.</div>`;
    const act=S.sessions.filter(s=>s.session_status!=="SESSION_STATUS_ARCHIVED").length;
    $("sess-sub").textContent=`${act} active`;
  }
  const sc=$("sched");
  if (S.trigErr) sc.innerHTML=`<div class="empty">${esc(S.trigErr)}</div>`;
  else if (!Array.isArray(S.triggers)) sc.innerHTML=`<div class="empty">Loading scheduled bots…</div>`;
  else sc.innerHTML = S.triggers.length ? S.triggers.map(t=>{
      const ok=t.last_run?.status==="ROUTINE_RUN_STATUS_SUCCEEDED";
      return `<div><strong>${esc(t.name)}</strong><span class="meta">${t.enabled?"":`<span class="chip">Paused</span>`}${t.last_run?`<span class="chip ${ok?"good":"bad"}">${ok?"Last run OK":"Last run failed"}</span>`:""}<span class="mono">Next ${esc(t.next_run_at?fmtTime(t.next_run_at):"—")}</span></span></div>`;
    }).join("") : `<div class="empty">No scheduled bots.</div>`;
}

function renderTabs(){
  const wide=matchMedia("(min-width:640px)").matches;
  const show = wide ? S.rightTab : S.tab;
  for (const t of ["reports","projects","sessions"]) $("pane-"+t).hidden = show!==t;
  if(!wide) $("pane-today").hidden = S.tab!=="today"; else $("pane-today").hidden=false;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  document.querySelectorAll(".wide-tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.rightTab)));
}
function render(){ renderTabs(); renderToday(); renderReports(); renderProjects(); renderSessions();
  $("today-line").textContent = new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"long",month:"long",day:"numeric"}).format(new Date()) + " · Detroit"; }
function setLive(state,txt){ $("live-dot").className="dot "+(state==="on"?"on":state==="err"?"err":""); $("live-txt").textContent=txt; }

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const tab=e.target.closest("[data-tab]");
  if (tab){ const t=tab.dataset.tab; if(tab.closest(".wide-tabs")) S.rightTab=t; else { S.tab=t; if(t!=="today") S.rightTab=t; } store.set("deck.tab",{tab:S.tab,right:S.rightTab}); renderTabs(); window.scrollTo(0,0); return; }
  const bot=e.target.closest("[data-bot]"); if(bot){ S.bot=bot.dataset.bot; renderReports(); return; }
  if (e.target.id==="toggle-arch"){ S.showArchived=!S.showArchived; renderSessions(); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const id=b.dataset.id, act=b.dataset.act;
  if (["today","later","skip","done"].includes(act)) decide(id, act);
  else if (act==="undo") decide(id, null);
  else if (act==="reply"){ S.replying[id]={text:""}; renderToday(); setTimeout(()=>$("rp-"+id)?.focus(),0); }
  else if (act==="cancel"){ delete S.replying[id]; renderToday(); }
  else if (act==="send") sendReply(id);
});
document.addEventListener("input", e=>{ const d=e.target.dataset?.draft; if(d&&S.replying[d]) S.replying[d].text=e.target.value; });
$("refresh").addEventListener("click", ()=>loadLive(true));
matchMedia("(min-width:640px)").addEventListener?.("change", renderTabs);

/* ---------- db: reports + decisions ---------- */
let db=null;
async function decide(id, choice){
  const prev=S.decisions[id];
  if (choice) S.decisions[id]={choice, at:new Date().toISOString()}; else delete S.decisions[id];
  renderToday();
  if(!db) return;
  try { const ref=db.collection("decisions").doc(id); if(choice) await ref.set(S.decisions[id]); else await ref.delete(); }
  catch(err){ if(prev) S.decisions[id]=prev; else delete S.decisions[id]; renderToday(); setLive("err","Couldn't save that choice. Try again."); }
}
async function initDb(){
  db = await claude.use("db").catch(()=>null);
  if(!db){ S.dbState="off"; render(); return; }
  const timer=setTimeout(()=>{ if(S.dbState==="loading"){ S.dbState="ready"; render(); } },10000);
  db.collection("reports").orderBy("createdAt","desc").limit(120).onSnapshot(snap=>{
    clearTimeout(timer); S.dbState="ready";
    S.reports=snap.docs.map(d=>({_id:d.id,...d.data()})); render();
  }, ()=>{ clearTimeout(timer); S.dbState="ready"; render(); });
  db.collection("decisions").onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); S.decisions=m; renderToday();
  }, ()=>{});
}

/* ---------- live: sessions + schedules via Claude Code Remote ---------- */
let mcp=null;
function payloadOf(r){
  let p=r?.payload;
  if (typeof p==="string"){ const i=p.indexOf("{"), j=p.lastIndexOf("}"); if(i>=0&&j>i){ try{ p=JSON.parse(p.slice(i,j+1)); }catch{} } }
  return p;
}
function errText(e, what){
  switch(e?.code){
    case "server_not_connected": return `Add the ${CCR} connector in claude.ai Settings → Connectors to see ${what}.`;
    case "needs_reauth": return `Reconnect ${CCR} in claude.ai Settings → Connectors to see ${what}.`;
    case "not_in_manifest": case "approval_required": case "consent_required": return `Allow ${CCR} for this page (Refresh asks again) to see ${what}.`;
    case "blocked_by_policy": return `Your organization blocks this tool, so ${what} can't load here.`;
    case "server_unavailable": return `${CCR} didn't answer. Tap Refresh in a moment.`;
    default: return `Couldn't load ${what}${e?.message?": "+e.message:"."}`;
  }
}
async function loadLive(force){
  if(!mcp){ S.sessErr=S.sessErr||"Open this page in Claude to see your live sessions."; S.trigErr=S.trigErr||"Open this page in Claude to see your scheduled bots."; setLive("","Offline view"); render(); return; }
  setLive("","Updating…");
  const opt = force ? {cache:{staleTime:0,gcTime:300000,refresh:true}} : {cache:{staleTime:60000,gcTime:300000}};
  const [s,t] = await Promise.allSettled([
    mcp.callTool(CCR,"list_sessions",{limit:100,mine:true},opt),
    mcp.callTool(CCR,"list_triggers",{limit:50},opt),
  ]);
  if (s.status==="fulfilled"){ const p=payloadOf(s.value); const arr=p?.ccr?.data||p?.data||p?.sessions; S.sessions=Array.isArray(arr)?arr:[]; S.sessErr=null; }
  else { S.sessErr=errText(s.reason,"your sessions"); if(["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy"].includes(s.reason?.code)) S.sessions=null; }
  if (t.status==="fulfilled"){ const p=payloadOf(t.value); const arr=p?.data||p?.triggers; S.triggers=Array.isArray(arr)?arr:[]; S.trigErr=null; }
  else S.trigErr=errText(t.reason,"your scheduled bots");
  const ok = s.status==="fulfilled";
  const stamp = ok && s.value?.cache?.storedAt ? new Date(s.value.cache.storedAt) : new Date();
  setLive(ok?"on":"err", ok ? "Updated "+new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit"}).format(stamp) : "Sessions unavailable");
  render();
}
async function sendReply(id){
  const r=S.replying[id]; const sid=id.slice(2); const text=(r?.text||"").trim();
  if(!text){ r.msg="Write your answer first."; renderToday(); return; }
  r.busy=true; r.msg=""; renderToday();
  try{
    await mcp.callTool(CCR,"send_message",{session_id:sid,message:text},{cache:false});
    delete S.replying[id]; await decide(id,"done"); setLive("on","Answer sent");
  }catch(e){
    r.busy=false;
    r.msg = e?.code==="server_unavailable"||e?.code==="upstream_error" ? "No confirmation came back. Check the session before sending again." : errText(e,"replies");
    renderToday();
  }
}
async function initMcp(){
  mcp = await claude.use("mcp").catch(()=>null);
  if(mcp){
    try{ const lt=await mcp.listTools(CCR); const tools=(lt.servers?.[0]?.tools||[]).map(x=>x.name); S.canReply = !lt.servers?.[0] || tools.length===0 || tools.includes("send_message"); }catch{ S.canReply=false; }
  }
  await loadLive(false);
}

/* ---------- boot ---------- */
const saved=store.get("deck.tab",null); if(saved){ S.tab=saved.tab||"today"; S.rightTab=saved.right||"reports"; }
render();
if (window.claude?.use){ initDb(); initMcp(); setInterval(()=>{ if(document.visibilityState==="visible") loadLive(false); }, 5*60*1000); }
else { S.dbState="off"; S.sessErr="Open this page in Claude to see your live sessions."; S.trigErr="Open this page in Claude to see your scheduled bots."; setLive("","Offline view"); render(); }
})();
</script>
