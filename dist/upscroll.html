  { id: "mo18", topic: "money", headline: "A 2% raise during 4% inflation is a pay cut", body: "Money illusion is the habit of judging money by its face value instead of what it buys. If prices rise faster than your pay, your real income falls even as the number on your paycheck goes up.", q: "Your pay rises 2% while prices rise 4%. What happened to your real income?", options: ["It rose about 2%", "It stayed the same", "It fell about 2%", "It rose about 6%"], a: 2, explain: "The term 'money illusion' was popularized by economist Irving Fisher in his 1928 book of that name.", tip: "Try this: in salary talks, compare any raise to the current inflation rate, not to zero." },

  // ---------------- MIND ----------------
  { id: "mi01", topic: "mind", headline: "Money you've already spent shouldn't decide what you do next", body: "The sunk cost fallacy is continuing something because of what you've already invested. The ticket money is gone either way; the only real question is whether the next hour is worth it.", q: "You keep watching a bad movie only because you paid for the ticket. Which bias is this?", options: ["Anchoring", "Sunk cost fallacy", "Availability heuristic", "Hindsight bias"], a: 1, explain: "It's also called the Concorde fallacy, after the supersonic jet project that continued despite clear signs it would lose money.", tip: "Try this: ask 'If I were starting fresh today, would I choose this?' and act on that answer." },
  { id: "mi02", topic: "mind", headline: "A random spin of a wheel can sway your number guesses", body: "In a classic 1974 study, people spun a wheel rigged to land on 10 or 65, then guessed the share of UN countries that were African. Median guesses were 25% and 45%, pulled toward the irrelevant number.", q: "A salesperson opens at $900, so $600 feels like a bargain. Which bias is at work?", options: ["Confirmation bias", "Loss aversion", "Anchoring bias", "Mere exposure effect"], a: 2, explain: "Anchoring works even when people know the anchor is random, and even on experts like judges and real estate agents.", tip: "Try this: before seeing any price, write down what you think something is worth." },
  { id: "mi03", topic: "mind", headline: "We judge risk by how easily examples come to mind", body: "The availability heuristic makes vivid, heavily reported events, like plane crashes, feel more common than they are, while everyday risks like car travel feel safer, though they cause far more deaths per mile.", q: "After seeing news of a plane crash, you drive instead of fly, believing it's safer. Which bias?", options: ["Sunk cost fallacy", "Fundamental attribution error", "Peak-end rule", "Availability heuristic"], a: 3, explain: "One study estimated that extra US road deaths in the year after 9/11 came partly from people avoiding flying.", tip: "" },
  { id: "mi04", topic: "mind", headline: "Spreading out study sessions beats cramming for memory", body: "The spacing effect, first documented by Hermann Ebbinghaus in 1885, shows that reviewing material over several days produces far better long-term recall than the same time spent in one session.", q: "For long-term memory, what beats one long cramming session of the same total time?", options: ["Spaced reviews over days", "Rereading notes at high speed", "Studying with calm music on", "Highlighting the key lines"], a: 0, explain: "Ebbinghaus tested himself on nonsense syllables to measure forgetting, producing the first 'forgetting curve'.", tip: "Try this: review new material after 1 day, then 3 days, then a week." },
  { id: "mi05", topic: "mind", headline: "Testing yourself teaches you more than rereading", body: "The testing effect: pulling information out of memory strengthens it. In a 2006 study, students who practiced recalling a passage remembered much more a week later than those who reread it.", q: "Which study method most improves long-term memory, according to research?", options: ["Rereading the text several times", "Practicing recall from memory", "Highlighting the key passages", "Copying out notes neatly"], a: 1, explain: "Students who reread often felt more confident, even though they remembered less. Fluency is not the same as learning.", tip: "Try this: close the book and write down everything you remember before checking." },
  { id: "mi06", topic: "mind", headline: "People test their beliefs by looking for proof they're right", body: "In Peter Wason's 1960 2-4-6 task, people guessed a hidden number rule. Most tested only sequences fitting their own guess, so they rarely discovered the true rule: any increasing numbers.", q: "You only read news that supports your view and dismiss the rest. Which bias is this?", options: ["Hindsight bias", "Availability heuristic", "Confirmation bias", "Peak-end rule"], a: 2, explain: "The fastest way to test an idea is to look for a case that would prove it wrong.", tip: "Try this: for any strong opinion, find the best argument against it and state it fairly." },
  { id: "mi07", topic: "mind", headline: "After the fact, we believe we saw it coming all along", body: "Hindsight bias makes outcomes seem obvious once known. In 1970s studies, people recalled their earlier predictions about real events as closer to what actually happened than they had been.", q: "After a team loses, you insist you 'knew it all along', though you predicted a win. Which bias?", options: ["Survivorship bias", "Anchoring bias", "Sunk cost fallacy", "Hindsight bias"], a: 3, explain: "Hindsight bias can make us judge past decisions by their outcomes instead of what was knowable at the time.", tip: "" },
  { id: "mi08", topic: "mind", headline: "We underestimate how long tasks take, even with past experience", body: "The planning fallacy: in a 1994 study, students predicted they'd finish their theses in about 34 days; the average actually took about 56. We imagine the best-case plan and ignore past delays.", q: "You always think a report will take 2 hours, and it always takes 5. What is this called?", options: ["Planning fallacy", "Spotlight effect", "Mere exposure effect", "Anchoring"], a: 0, explain: "Hofstadter's law jokes: it always takes longer than you expect, even when you take into account Hofstadter's law.", tip: "" },
  { id: "mi09", topic: "mind", headline: "Studying only the winners can teach you exactly the wrong lesson", body: "Survivorship bias: in World War II, statistician Abraham Wald pointed out that damage on returning planes showed where planes could be hit and survive. The armor belonged where returning planes had no holes.", q: "You copy habits of famous dropouts, ignoring the many who dropped out and failed. Which bias?", options: ["Confirmation bias", "Survivorship bias", "Loss aversion", "Hindsight bias"], a: 1, explain: "The missing data, failures that never got studied, is often the most important part of the picture.", tip: "" },
  { id: "mi10", topic: "mind", headline: "Before you tear down a fence, find out why it was put up", body: "Chesterton's fence is a mental model from writer G.K. Chesterton: don't remove a rule or tradition until you understand why it exists. The reason may be hidden but still important.", q: "What does the mental model 'Chesterton's fence' advise?", options: ["Remove outdated rules quickly", "Add more fences to stay safe", "Learn why a rule exists first", "Never change any existing rule"], a: 2, explain: "It doesn't say rules can't change, only that the burden is on the reformer to understand the original reason first.", tip: "Try this: before deleting an odd step in a process, ask the person who added it." },
  { id: "mi11", topic: "mind", headline: "People notice your embarrassing shirt far less than you think", body: "The spotlight effect: in a 2000 study, students wearing a Barry Manilow T-shirt guessed about half the room noticed it. Only about a quarter actually did.", q: "You think everyone noticed your bad haircut, but few did. What is this called?", options: ["Fundamental attribution error", "Availability heuristic", "Peak-end rule", "Spotlight effect"], a: 3, explain: "We overestimate attention because we are the center of our own experience, and everyone else is busy being the center of theirs.", tip: "" },
  { id: "mi12", topic: "mind", headline: "We blame people's character and overlook their circumstances", body: "The fundamental attribution error: when someone cuts us off in traffic, we assume they're a jerk, rarely considering that they might be rushing to an emergency or simply didn't see us.", q: "A coworker is late and you assume they're lazy, never considering traffic. Which bias?", options: ["Fundamental attribution error", "Availability heuristic", "Planning fallacy", "Mere exposure effect"], a: 0, explain: "A 1967 study found people judged essay writers' true opinions from essays, even knowing the writers were assigned a side.", tip: "" },
  { id: "mi13", topic: "mind", headline: "Simply seeing something repeatedly makes you like it more", body: "The mere exposure effect, studied by Robert Zajonc in 1968, shows people tend to prefer things they've encountered more often, from words and faces to songs, even without noticing the repetition.", q: "A song you disliked at first grows on you after hearing it many times. Which effect?", options: ["Spotlight effect", "Mere exposure effect", "Availability heuristic", "Survivorship bias"], a: 1, explain: "It also helps explain why people often prefer their mirror image, while friends prefer their non-mirrored photo.", tip: "" },
  { id: "mi14", topic: "mind", headline: "People chose more pain when it ended a little less painfully", body: "In a 1993 study, people held a hand in painfully cold water for 60 seconds, and separately for 90 seconds where the last 30 were slightly warmer. Most chose to repeat the longer trial: we remember peaks and endings, not durations.", q: "Memories of an experience are shaped mostly by its most intense moment and its end. What is this?", options: ["Spacing effect", "Hindsight bias", "Peak-end rule", "Availability heuristic"], a: 2, explain: "This 'duration neglect' was also seen in colonoscopy patients, whose memories depended on how the procedure ended.", tip: "Try this: end meetings, trips, and workouts on a high note; it shapes how they're remembered.", legendary: true },
  { id: "mi15", topic: "mind", headline: "Mixing up practice problems feels harder but works better", body: "Interleaving means shuffling different problem types instead of practicing one type at a time. In a 2007 math study, students who practiced mixed problems scored far higher on a test a week later.", q: "Which practice approach led to better test scores in learning studies?", options: ["Drilling one problem type at a time", "Only the easiest problems", "Studying worked solutions only", "Mixing problem types together"], a: 3, explain: "Mixing forces you to identify which method a problem needs, the skill tests actually demand.", tip: "Try this: shuffle flashcards or practice problems from different chapters together." },
  { id: "mi16", topic: "mind", headline: "Half of viewers missed a person in a gorilla suit", body: "In a 1999 study, people counting basketball passes in a video often failed to notice a person in a gorilla suit walking through the scene. This inattentional blindness shows focus can hide the obvious.", q: "Why do people often miss unexpected things in plain sight while focused on a task?", options: ["Inattentional blindness", "Weak peripheral vision", "Short-term memory decay", "Confirmation bias"], a: 0, explain: "In the original study, the gorilla stayed on screen for about five seconds and even paused to thump its chest.", tip: "", legendary: true },
  { id: "mi17", topic: "mind", headline: "Imagining a plan already failed helps you spot its flaws", body: "A pre-mortem, a technique from psychologist Gary Klein, asks a team to imagine the project failed and explain why. It makes it safer to voice doubts and surfaces risks optimism hides.", q: "In a 'pre-mortem', what do you imagine before starting a project?", options: ["It has already succeeded", "It has already failed", "It will never start", "Its budget doubled"], a: 1, explain: "Imagining an outcome as already certain seems to make it easier to generate concrete explanations for it.", tip: "Try this: before a big decision, write three reasons it might fail one year from now." },
  { id: "mi18", topic: "mind", headline: "To solve a problem, ask how you'd guarantee failure", body: "Inversion is a mental model popularized by investor Charlie Munger, echoing mathematician Carl Jacobi's advice: 'invert, always invert.' Listing ways to fail reveals what to avoid.", q: "You want better sleep, so you list everything that would ruin it. Which mental model is this?", options: ["Sunk cost", "Anchoring", "Inversion", "Mere exposure"], a: 2, explain: "Avoiding obvious mistakes is often easier and more reliable than trying to be brilliant.", tip: "" },

  // ---------------- TECH ----------------
  { id: "te01", topic: "tech", headline: "A real moth was once taped into a computer's logbook as a 'bug'", body: "In 1947, operators of the Harvard Mark II found a moth stuck in a relay and taped it in the log as the 'first actual case of bug being found.' The word bug for a glitch was already in use.", q: "What was found inside the Harvard Mark II computer in 1947, famously logged as a 'bug'?", options: ["A cockroach", "A spider", "A beetle", "A dead moth"], a: 3, explain: "Thomas Edison used 'bug' for technical faults in the 1870s. The logbook page is held by the Smithsonian.", tip: "" },
  { id: "te02", topic: "tech", headline: "GPS would drift about 10 km a day without Einstein's relativity", body: "GPS satellite clocks tick about 38 microseconds a day faster than clocks on the ground, due to weaker gravity and their speed. Engineers correct for this; without it, positions would drift by kilometers daily.", q: "Why must GPS satellite clocks be adjusted using Einstein's theories of relativity?", options: ["Time ticks at a different rate", "Solar wind slows their clocks", "Signals bounce off the Moon", "They overheat in direct sunlight"], a: 0, explain: "Speed slows the satellite clocks by about 7 microseconds a day; weaker gravity speeds them by about 45, giving a net gain of 38.", tip: "", legendary: true },
  { id: "te03", topic: "tech", headline: "Almost all intercontinental internet traffic runs under the sea", body: "Satellites carry only a sliver. About 99% of data crossing oceans travels through fiber-optic cables on the seafloor, some thousands of kilometers long and about as thick as a garden hose.", q: "How does most internet data travel between continents?", options: ["Communication satellites", "Undersea fiber-optic cables", "High-altitude relay balloons", "Chains of radio towers"], a: 1, explain: "The first transatlantic telegraph cable was laid in 1858, but it failed after only about three weeks.", tip: "" },
  { id: "te04", topic: "tech", headline: "One of the first webcams was pointed at a coffee pot", body: "At the University of Cambridge in 1991, researchers set up a camera on a coffee pot so they could check if it was full without walking to the room. In 1993 it was put on the web.", q: "What did the famous Trojan Room webcam at Cambridge University show?", options: ["A fish tank", "A parking lot", "A coffee pot", "The weather outside"], a: 2, explain: "The pot was later auctioned on eBay in 2001 for about 3,350 pounds when the camera went offline.", tip: "" },
  { id: "te05", topic: "tech", headline: "CAPTCHA is an acronym for a test of humanity", body: "CAPTCHA stands for 'Completely Automated Public Turing test to tell Computers and Humans Apart'. It flips Alan Turing's idea: here a machine judges whether you're human.", q: "What is a CAPTCHA designed to do?", options: ["Encrypt your password", "Speed up page loading", "Verify your email", "Tell humans from bots"], a: 3, explain: "Some versions put human effort to work, such as reCAPTCHA, which once helped digitize words from old books.", tip: "" },
  { id: "te06", topic: "tech", headline: "QR codes were invented to track car parts", body: "In 1994, engineer Masahiro Hara at Denso Wave, a Toyota group company, created the QR code to scan car parts quickly. QR stands for 'Quick Response'.", q: "What were QR codes originally invented to do?", options: ["Track car parts in factories", "Let diners pay at restaurants", "Share website links on posters", "Scan airline boarding passes"], a: 0, explain: "Built-in error correction means many QR codes can still scan even when part of the code is damaged or covered.", tip: "" },
  { id: "te07", topic: "tech", headline: "Apollo's computer memory was woven by hand", body: "The Apollo Guidance Computer stored its programs in 'core rope memory': wires threaded through or around tiny magnetic rings by hand, each choice encoding a 1 or a 0. It had about 4 KB of working memory.", q: "How was the Apollo Guidance Computer's permanent program memory made?", options: ["Etched onto early silicon chips", "Hand-woven wire through rings", "Printed onto punched cards", "Stored on magnetic tape reels"], a: 1, explain: "Much of the weaving was done by skilled workers, many of them women, at Raytheon. Software had to be final months before launch.", tip: "", legendary: true },
  { id: "te08", topic: "tech", headline: "Your phone screen senses the electricity in your finger", body: "Most phones use capacitive touchscreens, which detect a change in an electric field when a conductive object like skin touches them. That's why ordinary gloves or a fingernail usually don't work.", q: "Why don't most touchscreens respond to a gloved finger?", options: ["Gloves are too soft to press", "Screens detect your body heat", "Screens sense conductive skin", "Gloves block a light sensor"], a: 2, explain: "Touchscreen gloves work by weaving conductive thread into the fingertips.", tip: "" },
  { id: "te09", topic: "tech", headline: "Adding letters to a password beats adding symbols", body: "Each extra character multiplies the possibilities. An 8-letter lowercase password has about 200 billion combinations; a 12-letter one has about 95 quadrillion, roughly 457,000 times more.", q: "Which usually makes a password harder to crack by guessing?", options: ["Swapping o for 0", "Adding your birth year", "Capitalizing the first letter", "Making it much longer"], a: 3, explain: "Predictable swaps like @ for a are built into cracking tools, so they add little strength.", tip: "Try this: use a password manager, or a passphrase of four or more random words." },
  { id: "te10", topic: "tech", headline: "Junk email is called spam because of a Monty Python sketch", body: "In a 1970 Monty Python sketch, a cafe's menu is overrun with Spam and a group of Vikings drowns out conversation by singing 'Spam' over and over. Early internet users borrowed the name for unwanted floods of messages.", q: "Where does the term 'spam' for junk messages come from?", options: ["A Monty Python comedy sketch", "An acronym for 'sent post'", "A 1990s computer virus name", "A brand of early email software"], a: 0, explain: "One of the first widely noticed commercial spams was a 1994 Usenet ad by two lawyers offering green card lottery services.", tip: "" },
  { id: "te11", topic: "tech", headline: "Bluetooth is named after a 10th-century Viking king", body: "Harald 'Bluetooth' Gormsson united Denmark and parts of Norway. In 1997, an engineer proposed his name for a tech meant to unite devices; the logo combines Harald's initials in runes.", q: "Who is the wireless technology Bluetooth named after?", options: ["A Swedish engineer", "A Danish king", "A Norse god", "A dentist"], a: 1, explain: "The name was meant to be temporary. Proposed alternatives included 'PAN' and 'RadioWire'.", tip: "" },
  { id: "te12", topic: "tech", headline: "The padlock in your browser doesn't mean a site is trustworthy", body: "HTTPS and the padlock mean your connection to the site is encrypted, so others can't easily read or alter data in transit. A scam site can have a padlock too.", q: "What does the padlock icon (HTTPS) in a browser actually guarantee?", options: ["The site is safe and legit", "The site has no viruses", "The connection is encrypted", "The site is government-approved"], a: 2, explain: "Free certificates made HTTPS nearly universal, which is great for privacy but means it's no longer a sign of legitimacy.", tip: "Try this: check the exact domain name spelling before entering a password, padlock or not." },
  { id: "te13", topic: "tech", headline: "The @ in email addresses was picked in 1971 for a simple reason", body: "Ray Tomlinson sent the first networked email between computers on ARPANET. He chose @ to separate the user from the computer's name because it meant 'at' and appeared in no one's name.", q: "Why did Ray Tomlinson choose the @ symbol for email addresses?", options: ["It looked like a little envelope", "It came from his company's logo", "It was the only spare key left", "It meant 'at' and was little used"], a: 3, explain: "Tomlinson said the first test messages were forgettable, something like 'QWERTYUIOP'.", tip: "" },
  { id: "te14", topic: "tech", headline: "Noise-canceling headphones fight sound with opposite sound", body: "Microphones pick up outside noise, and the headphones play a sound wave that is its mirror image. The peaks and troughs cancel out, a process called destructive interference.", q: "How do active noise-canceling headphones reduce noise?", options: ["They play an inverted sound wave", "Thick foam pads block the sound", "They lower the volume you hear", "They filter out speech frequencies"], a: 0, explain: "It works best on steady, low sounds like engine hum; sudden or high-pitched sounds are harder to cancel.", tip: "" },
  { id: "te15", topic: "tech", headline: "The first item scanned with a UPC barcode was chewing gum", body: "On 26 June 1974, at a supermarket in Troy, Ohio, a cashier scanned a 10-pack of Wrigley's Juicy Fruit gum, the first retail sale using a UPC barcode.", q: "What was the first product sold using a UPC barcode scan in 1974?", options: ["A can of tomato soup", "A pack of chewing gum", "A carton of fresh milk", "A box of breakfast cereal"], a: 1, explain: "That pack of gum is now kept at the Smithsonian's National Museum of American History.", tip: "" },
  { id: "te16", topic: "tech", headline: "Keeping your phone at 100% and hot wears its battery faster", body: "Lithium-ion batteries age faster when held at high charge and high temperature. Many phones now offer optimized charging that pauses around 80% to reduce this stress.", q: "Which habit speeds up wear on a lithium-ion phone battery?", options: ["Charging it in short bursts", "Unplugging before it's full", "Staying at 100% while hot", "Turning it off every night"], a: 2, explain: "Unlike old nickel-cadmium cells, lithium-ion batteries have no 'memory effect', so topping up often is fine.", tip: "Try this: turn on your phone's optimized or limited charging setting and avoid charging it under a pillow." },
  { id: "te17", topic: "tech", headline: "The first hard drive weighed about a ton and held under 4 MB", body: "IBM's 350 disk drive, launched in 1956 with the RAMAC computer, used fifty 24-inch platters to store about 3.75 MB. Companies leased it rather than bought it.", q: "About how much data could IBM's first hard drive, from 1956, store?", options: ["About 4 kilobytes", "About 4 megabytes", "About 4 gigabytes", "About 400 megabytes"], a: 1, explain: "That's roughly the size of a single MP3 song today.", tip: "" },
  { id: "te18", topic: "tech", headline: "Incognito mode hides your browsing from your device, not the internet", body: "Private browsing stops your browser from saving history, cookies, and form data after you close it. Your internet provider, employer network, and the sites you visit can still see your activity.", q: "Who can still see your activity when you use a browser's incognito mode?", options: ["No one, not even your browser", "Only the maker of your browser", "Only other people using your device", "Websites and your network provider"], a: 3, explain: "Files you download and bookmarks you save while in incognito mode still remain on your device.", tip: "" },

  // ---------------- CULTURE ----------------
  { id: "cu01", topic: "culture", headline: "Ketchup started as a fermented fish sauce", body: "The word likely comes from 'ke-tsiap', a fish sauce from southern China. British traders brought the idea home, making ketchups from mushrooms or walnuts before tomato ketchup took over in the 1800s.", q: "What was the original 'ketchup' made from?", options: ["Fermented fish", "Ripe tomatoes", "Red chili peppers", "Cooked apples"], a: 0, explain: "Tomato ketchup recipes appeared in the early 1800s; Heinz began selling its tomato ketchup in 1876.", tip: "" },
  { id: "cu02", topic: "culture", headline: "Being stolen helped make the Mona Lisa world-famous", body: "In 1911, Louvre worker Vincenzo Peruggia walked out with the painting. Its two-year absence made headlines worldwide, and it was recovered in Florence in 1913.", q: "Which event greatly boosted the Mona Lisa's worldwide fame?", options: ["Its 1960s tour of US museums", "Its 1911 theft from the Louvre", "Its sale to the king of France", "A Hollywood film in the 1950s"], a: 1, explain: "Crowds lined up at the Louvre just to see the empty space on the wall where the painting had hung.", tip: "" },
  { id: "cu03", topic: "culture", headline: "Carrots weren't always orange", body: "Early cultivated carrots, from Central Asia, were mostly purple or yellow. Orange varieties were developed and popularized by Dutch growers in the 1600s and later became the global standard.", q: "What colors were most early cultivated carrots?", options: ["Deep orange and red", "White and green", "Purple and yellow", "Black and blue"], a: 2, explain: "The popular story that the Dutch bred orange carrots to honor William of Orange has no solid evidence behind it.", tip: "" },
  { id: "cu04", topic: "culture", headline: "The word 'nice' once meant foolish", body: "'Nice' comes from Latin 'nescius', meaning ignorant. Over centuries in English it shifted through meanings like silly, shy, and fussy before settling on pleasant in the 1700s.", q: "What did the word 'nice' originally mean?", options: ["Kind and gentle", "Pretty or elegant", "Costly or luxurious", "Foolish or ignorant"], a: 3, explain: "A trace of its 'fussy, precise' phase survives in phrases like 'a nice distinction', meaning a fine or subtle one.", tip: "" },
  { id: "cu05", topic: "culture", headline: "Beethoven wrote his Ninth Symphony while profoundly deaf", body: "Beethoven's hearing declined from his late 20s. By the 1824 premiere of the Ninth, he was so deaf that a singer turned him around to see the audience applauding.", q: "What was unusual about Beethoven when he wrote his Ninth Symphony?", options: ["He was profoundly deaf", "He was still a teenager", "He had gone fully blind", "He couldn't read music"], a: 0, explain: "Beethoven used 'conversation books' in which visitors wrote their side of the conversation; many of them survive.", tip: "" },
  { id: "cu06", topic: "culture", headline: "The Olympics once gave medals for painting and poetry", body: "From 1912 to 1948, the Olympic Games held art competitions in architecture, literature, music, painting, and sculpture. Entries had to be inspired by sport.", q: "Which of these once earned Olympic medals, from 1912 to 1948?", options: ["Chess and checkers", "Painting and poetry", "Cooking and baking", "Ballroom and folk dancing"], a: 1, explain: "Modern Olympics founder Pierre de Coubertin won a gold for literature in 1912, entering under a pseudonym.", tip: "", legendary: true },
  { id: "cu07", topic: "culture", headline: "Flying buttresses let Gothic cathedrals become walls of glass", body: "Stone vaults push outward on walls. Flying buttresses, arched supports outside the building, carry that push away, so walls could be thinner and filled with huge stained-glass windows.", q: "What did flying buttresses allow Gothic cathedral builders to do?", options: ["Build deep crypts underground", "Build mostly in wood, not stone", "Have thin walls and big windows", "Build taller without any arches"], a: 2, explain: "Pointed arches helped too: they direct more of a vault's weight downward than round arches do.", tip: "" },
  { id: "cu08", topic: "culture", headline: "A 1,900-year-old dome is still the largest of its kind", body: "Rome's Pantheon, completed around 125 CE, has a dome about 43 meters across. It remains the world's largest unreinforced concrete dome.", q: "Which building has the world's largest unreinforced concrete dome?", options: ["Hagia Sophia, Istanbul", "St. Peter's Basilica", "Florence Cathedral", "The Pantheon in Rome"], a: 3, explain: "Romans used lighter material like pumice toward the top, and the dome thins to an open 'oculus' about 8 meters wide.", tip: "", legendary: true },
  { id: "cu09", topic: "culture", headline: "The word 'robot' comes from a Czech play about forced labor", body: "Karel Capek's 1920 play 'R.U.R.' introduced the word robot, from Czech 'robota', meaning forced labor. Capek credited his brother Josef with suggesting it.", q: "The word 'robot' comes from a Czech word meaning what?", options: ["Forced labor", "Metal servant", "Thinking machine", "Iron worker"], a: 0, explain: "Capek's robots were actually artificial biological beings, closer to what we'd now call androids.", tip: "" },
  { id: "cu10", topic: "culture", headline: "Italian food had no tomatoes until the 1500s", body: "Tomatoes are native to the Americas and reached Europe in the 16th century. Many Europeans grew them as curiosities, and tomato sauce recipes appear in Italy only around the late 1600s.", q: "Where did tomatoes originally come from?", options: ["Southern Italy", "The Americas", "The Middle East", "North Africa"], a: 1, explain: "One early Italian name for the tomato was 'pomodoro', meaning 'golden apple', suggesting early varieties were yellow.", tip: "" },
  { id: "cu11", topic: "culture", headline: "Piano is short for an instrument that plays 'soft-loud'", body: "The full name is pianoforte, Italian for 'soft-loud'. Built around 1700 by Bartolomeo Cristofori, it used hammers so players could control volume by touch, which the harpsichord couldn't do.", q: "Why was the piano originally called the 'pianoforte'?", options: ["It was very heavy to move", "It was first built in a fort", "It could play soft and loud", "It had two separate keyboards"], a: 2, explain: "A harpsichord plucks strings, so pressing the key harder doesn't make it louder.", tip: "" },
  { id: "cu12", topic: "culture", headline: "'Goodbye' is a shortened blessing", body: "Goodbye comes from 'God be with ye', squeezed over time into forms like 'godbwye'. The 'good' likely crept in by analogy with 'good day' and 'good night'.", q: "What phrase did the word 'goodbye' evolve from?", options: ["Good day to you", "Go by in peace", "Good night to ye", "God be with ye"], a: 3, explain: "Spanish 'adios' and French 'adieu' have a similar origin, meaning 'to God'.", tip: "" },
  { id: "cu13", topic: "culture", headline: "Top violinists often can't tell a Stradivarius from a new violin", body: "In blind tests published in 2012 and 2014, professional violinists playing old Italian and new violins couldn't reliably identify which was which and often preferred the new ones.", q: "In blind tests, how did top violinists judge Stradivarius violins against new ones?", options: ["Couldn't reliably tell them apart", "Always picked the Stradivarius", "Found new violins harsh and thin", "Said the Strads sounded far louder"], a: 0, explain: "Players wore modified goggles in dim light, so they couldn't see the instruments they were playing.", tip: "" },
  { id: "cu14", topic: "culture", headline: "Most 'wasabi' served outside Japan isn't real wasabi", body: "Real wasabi comes from a plant that is hard to grow and expensive. Most of the green paste served with sushi is horseradish mixed with mustard and green coloring.", q: "What is the green 'wasabi' paste served with sushi usually made from?", options: ["Mashed avocado and lime", "Horseradish and mustard", "Ground green tea leaves", "Seaweed and green chili"], a: 1, explain: "Real wasabi is usually grated fresh, and its flavor fades within about 15 minutes.", tip: "" },
  { id: "cu15", topic: "culture", headline: "Sushi began as a way to preserve fish in fermenting rice", body: "Early sushi, called narezushi, packed salted fish in rice for months; the fermenting rice preserved it and was often thrown away. Fast, fresh nigiri sushi emerged in Edo-era Tokyo, in the early 1800s.", q: "What was the original purpose of the rice in early sushi?", options: ["To decorate the plate", "To add a mild sweetness", "To preserve the fish", "To soak up fish oils"], a: 2, explain: "Funazushi, made from carp near Lake Biwa, is a fermented style still made in Japan today.", tip: "" },
  { id: "cu16", topic: "culture", headline: "The word 'emoji' has nothing to do with 'emotion'", body: "Emoji is Japanese: 'e' means picture and 'moji' means character. The resemblance to the English word emotion is a coincidence.", q: "What does the Japanese word 'emoji' literally mean?", options: ["Emotion icon", "Electronic image", "Little smiling face", "Picture character"], a: 3, explain: "An influential early set of 176 emoji, designed for a Japanese mobile service in 1999, is held by the Museum of Modern Art in New York.", tip: "" },
  { id: "cu17", topic: "culture", headline: "Fortune cookies most likely come from Japan, not China", body: "Researchers trace fortune cookies to Japanese crackers with fortunes tucked inside. Japanese-American bakers in California popularized them in the early 1900s, and they're rare in China.", q: "Where do fortune cookies most likely originate?", options: ["Japan", "China", "Korea", "Vietnam"], a: 0, explain: "Japanese bakeries near Kyoto still make similar cookies, called tsujiura senbei, which are larger and browner.", tip: "" },
  { id: "cu18", topic: "culture", headline: "The word 'quarantine' comes from the Italian for '40 days'", body: "During plague outbreaks in the 1300s and 1400s, ships arriving at Venice had to wait 40 days, 'quaranta giorni', before passengers could come ashore.", q: "What does the word 'quarantine' originally refer to?", options: ["A ship's quarantine flag", "A 40-day waiting period", "A Latin word for sickness", "A type of hospital"], a: 1, explain: "The nearby port city of Ragusa (now Dubrovnik) began with a 30-day isolation in 1377, later extended.", tip: "" }
);

/* ---- src/content/facts-c.js ---- */
window.UP_CONTENT = window.UP_CONTENT || {};
(window.UP_CONTENT.facts = window.UP_CONTENT.facts || []).push(
  // ---------------- SKILLS ----------------
  { id: "sk01", topic: "skills", headline: "Curl your fingertips into a 'claw' when you chop", body: "Tuck your fingertips under and rest the flat of the knife against your knuckles. The blade can then only meet knuckle, not fingertip, and your knuckles guide each slice to an even width.", q: "When chopping, which hand position best protects your fingertips?", options: ["Fingers flat on top of the food", "Holding only the far end of the food", "Fingertips curled, knuckles forward", "Thumb pressing down on the food"], a: 2, explain: "Keep the knife tip near the board and move the claw back steadily as you slice.", tip: "Next time you dice an onion, slow down and use the claw for the first 20 cuts." },
  { id: "sk02", topic: "skills", headline: "A sharp knife is safer than a dull one", body: "A dull blade needs more force and tends to skid off slippery skins like tomatoes and onions, and that slip is when cuts happen. A sharp edge bites in where you aim it with light pressure.", q: "Why do cooks say a dull knife is more dangerous than a sharp one?", options: ["It needs more force and slips more","Its blunt edge rusts and spreads tetanus","Its nicked edge traps more bacteria","It cuts deeper when it slips"], a: 0, explain: "A honing steel realigns the edge between sharpenings; true sharpening removes metal and is needed less often.", tip: "Put a damp paper towel under your cutting board so it can't slide while you cut." },
  { id: "sk03", topic: "skills", headline: "Chicken is safe at 74 °C (165 °F), and its colour can't tell you", body: "Food-safety agencies such as the USDA say all poultry, whole or ground, should reach 74 °C (165 °F) in the thickest part. Pink meat or clear juices are unreliable signs; only a food thermometer actually tells you.", q: "What minimum internal temperature does the USDA recommend for cooked chicken?", options: ["63 °C (145 °F)", "68 °C (155 °F)", "71 °C (160 °F)", "74 °C (165 °F)"], a: 3, explain: "Push the probe into the thickest part, avoiding bone, fat and gristle, which can throw off the reading.", tip: "Buy an instant-read thermometer: it's a cheap upgrade to both food safety and juicier meat." },
  { id: "sk04", topic: "skills", headline: "Ground beef needs more cooking than a steak does", body: "On a whole steak, bacteria sit mostly on the surface, which searing kills. Grinding spreads them all through the meat, so the USDA advises 71 °C (160 °F) for ground beef but 63 °C (145 °F) plus a 3-minute rest for whole cuts.", q: "Why does ground beef need a higher cooking temperature than a whole steak?", options: ["Mince fat shields germs from the heat","Mince comes from older, tougher animals","Grinding makes the meat less acidic","Grinding spreads surface germs inside"], a: 3, explain: "That's why a rare burger carries more risk than a rare steak.", tip: "Check burgers by pushing a thermometer into the side of the patty, not by their colour." },
  { id: "sk05", topic: "skills", headline: "Leftovers should go in the fridge within two hours", body: "Bacteria multiply fastest between 4 °C and 60 °C (40-140 °F), the 'danger zone'. The USDA says refrigerate perishable food within 2 hours, or within 1 hour if it's above 32 °C (90 °F), like at a summer picnic.", q: "Per USDA guidance, how long can perishable food safely sit out at room temperature?", options: ["Up to 30 minutes","Up to 2 hours","Up to 6 hours","Up to 12 hours"], a: 1, explain: "Reheating doesn't always rescue it: some bacteria leave behind toxins that heat doesn't destroy.", tip: "Split big pots of stew into shallow containers so they cool quickly in the fridge." },
  { id: "sk06", topic: "skills", headline: "Washing raw chicken spreads germs instead of removing them", body: "Rinsing poultry splashes bacteria like Salmonella and Campylobacter onto the sink, counters and nearby food. The CDC and USDA advise skipping the rinse: cooking to the right temperature is what kills the germs.", q: "What do the CDC and USDA advise about washing raw chicken before cooking?", options: ["Rinse it under hot water","Don't rinse it at all","Rinse it with vinegar first","Soak it in salt water"], a: 1, explain: "In a 2019 USDA study, about a quarter of people who washed raw poultry spread its bacteria to salad they made next.", tip: "Pat chicken dry with paper towels and bin them straight away, then wash your hands." },
  { id: "sk07", topic: "skills", headline: "Dry meat browns; wet meat steams", body: "The browning reactions that create savoury flavour need temperatures well above water's boiling point. Surface moisture holds the meat near 100 °C until it evaporates, so pat meat dry and don't crowd the pan.", q: "Why should you pat meat dry before searing it?", options: ["Moisture stops the oil from heating","Dry meat absorbs the salt more evenly","Water on meat makes the fibres tougher","Wet surfaces stay too cool to brown"], a: 3, explain: "A crowded pan does the same: food releases steam faster than it can escape, so it stews instead of sears.", tip: "Sear in batches with a finger's width between pieces, and wait for a loud sizzle." },
  { id: "sk08", topic: "skills", headline: "Meat keeps cooking after you take it off the heat", body: "Heat stored in the outer layers keeps moving inward, so a roast's centre can rise several degrees as it rests. This is called carryover cooking. A short rest also lets juices thicken a little, so less runs out when you slice.", q: "In the kitchen, what does the term 'carryover cooking' describe?", options: ["Meat's temperature rising off the heat","Reheating leftovers safely the next day","Cooking two dishes in one pan at once","Finishing seared meat in the oven"], a: 0, explain: "Bigger, thicker cuts carry over more, so take them off a little before your target temperature.", tip: "Rest steaks about 5 minutes and large roasts 15-20, loosely covered with foil." },
  { id: "sk09", topic: "skills", headline: "Salting meat well ahead makes it juicier, not drier", body: "Salt first draws moisture out, but given time that brine is reabsorbed and loosens muscle proteins so they hold more water as they cook. Salting a steak 40+ minutes ahead, or a chicken overnight in the fridge, is called dry brining.", q: "What does it mean to 'dry brine' a piece of meat?", options: ["Soaking it in heavily salted water","Cooking it in a pan with no oil","Salting it well before cooking","Coating it in dry spices overnight"], a: 2, explain: "The awkward window is a few minutes to about half an hour in: moisture has been drawn out but not reabsorbed yet.", tip: "Salt tonight's chicken this morning and leave it uncovered in the fridge for crisper skin." },
  { id: "sk10", topic: "skills", headline: "Never thaw meat on the kitchen counter", body: "The USDA's safe ways to thaw are in the fridge, in cold water changed every 30 minutes, or in the microwave if you cook it right away. On the counter, the outside can sit in the danger zone while the middle is still frozen.", q: "Which of these is NOT a USDA-approved way to thaw frozen meat?", options: ["In the refrigerator", "In cold water changed every 30 min", "In the microwave, then cook at once", "On the kitchen counter"], a: 3, explain: "You can also cook meat straight from frozen; the USDA says it takes about 50% longer.", tip: "Move tomorrow's dinner from the freezer to the fridge tonight; set a reminder if you forget." },
  { id: "sk11", topic: "skills", headline: "Repeat back what you heard before you reply", body: "Active listening means showing you've understood before responding: sum up the other person's point in your own words, then ask if you got it right. It slows arguments down and catches misunderstandings early.", q: "In active listening, what should you do before giving your own view?", options: ["Paraphrase their point and check it","Share a similar story of your own","Offer a practical solution right away","Wait silently until they've finished"], a: 0, explain: "Even a quick 'So what you're saying is...' signals attention and invites a correction if you're off.", tip: "In your next disagreement, say 'Let me check I've got this right...' before making your case." },
  { id: "sk12", topic: "skills", headline: "People who ask follow-up questions tend to be better liked", body: "In Harvard studies of real conversations, including speed dates, people who asked more questions were liked more. Follow-up questions, which build on what the other person just said, drove the effect most.", q: "In Harvard research on conversation, which kind of question most boosted liking?", options: ["Questions about the weather", "Follow-up questions", "Yes-or-no questions", "Rhetorical questions"], a: 1, explain: "Follow-ups show you were listening; jumping to a new topic doesn't.", tip: "In your next chat, ask one more question about the last thing someone said before changing topic." },
  { id: "sk13", topic: "skills", headline: "Good feedback names a specific behaviour and its impact", body: "The Situation-Behaviour-Impact model: say when and where, what the person actually did (observable, not their character), and its effect. 'In Monday's meeting you cut Sam off twice, and he stopped contributing' beats 'You're rude.'", q: "In the Situation-Behaviour-Impact model, what should feedback describe?", options: ["What the person did and its effect","The person's attitude and personality","How others on the team feel about them","What you would have done instead"], a: 0, explain: "Describing actions instead of traits makes feedback easier to hear and gives the person something they can change.", tip: "Before giving feedback, write one sentence each for the situation, the behaviour and the impact." },
  { id: "sk14", topic: "skills", headline: "A real apology has no 'but' and no 'if'", body: "'I'm sorry if you were upset' shifts the focus to the other person's feelings. Effective apologies name what you did, take responsibility, acknowledge the impact and offer to make it right.", q: "Which phrase tends to undermine an apology?", options: ["'I was wrong, and I'm sorry I did it'","'How can I make this right for you?'","'I'm sorry if you were offended'","'I can see how much that hurt you'"], a: 2, explain: "In a 2016 study of apology elements, acknowledging responsibility mattered most, followed by an offer to repair.", tip: "Next time you apologise, stop after 'I'm sorry I did X.' Don't add a 'but'." },
  { id: "sk15", topic: "skills", headline: "To remember a name, say it back straight away", body: "Names often slip because we're busy thinking about what to say next. Hear the name, repeat it ('Nice to meet you, Priya'), use it once more in the conversation, and link it to something vivid about the person.", q: "What's a simple way to remember someone's name after an introduction?", options: ["Say it back to them right away", "Avoid using it until later", "Focus on their job title instead", "Write it down after you leave"], a: 0, explain: "Saying it aloud makes you actively retrieve it, and a vivid link gives the memory something to hang on.", tip: "If you missed a name, ask again within the first minute; it's far less awkward than later." },
  { id: "sk16", topic: "skills", headline: "Start a complaint with 'I feel', not 'You always'", body: "'You never help' tends to trigger defensiveness. An 'I' statement describes your experience and what you need: 'I feel overwhelmed when the dishes pile up. Can we split them?' Couples therapists widely teach this gentler start.", q: "In a conflict, which of these is a true 'I' statement?", options: ["'I think you never listen to me'","'I feel that you're always so selfish'","'I'm right and everyone agrees with me'","'I feel ignored when I'm interrupted'"], a: 3, explain: "Words like 'always' and 'never' invite the other person to argue about exceptions instead of the problem.", tip: "Turn one complaint today into: 'I feel ___ when ___. Could we ___?'" },
  { id: "sk17", topic: "skills", headline: "If a task takes under two minutes, do it now", body: "From David Allen's Getting Things Done: if something takes less than two minutes, doing it immediately costs less than writing it down, tracking it and coming back to it. Reply to the quick email, sign the form, wash the mug.", q: "In 'Getting Things Done', what should you do with a task that takes under two minutes?", options: ["Add it to your to-do list", "Do it immediately", "Delegate it", "Save it for a weekly review"], a: 1, explain: "It's for small incoming tasks; don't let a string of two-minute jobs crowd out your important work.", tip: "Clear every two-minute item in your inbox now, then close it and start your main task." },
  { id: "sk18", topic: "skills", headline: "Plans phrased 'When X, I will Y' are more likely to happen", body: "Psychologists call these implementation intentions. Instead of 'I'll exercise more', decide 'When I get home from work, I'll put on my running shoes.' A review of 94 studies found a medium-to-large boost to reaching goals.", q: "In habit research, what is an 'implementation intention'?", options: ["A written list of long-term life goals","A plan like 'When X, I'll do Y'","A reward you promise yourself for a task","A public promise made to a friend"], a: 1, explain: "Tying an action to a specific cue lets the situation trigger the behaviour, so you rely less on remembering.", tip: "Pick one goal and write: 'When [time or place], I will [specific action].'" },
  { id: "sk19", topic: "skills", headline: "Give tasks a slot on your calendar, not just a spot on a list", body: "Timeboxing means blocking a fixed window for a task (say, 9:00-10:30 for the report) and working only on it until time's up. It forces realistic choices about what fits in a day and puts a deadline on open-ended work.", q: "In time management, what does 'timeboxing' mean?", options: ["Sorting tasks into labelled categories","Doing the shortest tasks first","Working until a task is perfect","Giving a task a fixed time slot"], a: 3, explain: "A list hides how much it asks of you; a calendar shows when your day is already full.", tip: "Block tomorrow's most important task as a 90-minute meeting with yourself." },
  { id: "sk20", topic: "skills", headline: "Switching between tasks costs time with every jump", body: "Lab studies consistently find that switching tasks slows people down and adds errors compared with sticking to one, as the brain reloads the rules for each task. Each switch costs little, but it adds up across a day of pings.", q: "What do lab studies find happens when people switch between tasks?", options: ["They slow down and make more errors","They speed up as their brain warms up","Speed drops but accuracy improves","They remember more of each task"], a: 0, explain: "Batching similar work, like answering messages at set times, cuts down the number of switches.", tip: "Turn off non-essential notifications and check messages at three set times today." },
  { id: "sk21", topic: "skills", headline: "Writing down your next step can quiet a nagging unfinished task", body: "The 'Zeigarnik effect' claims unfinished tasks stick in memory better than finished ones, but replications have been mixed. More usefully, one study found making a concrete plan for an unfinished goal reduced intrusive thoughts about it.", q: "What's the evidence for the claim that we remember unfinished tasks better (Zeigarnik effect)?", options: ["It's been confirmed in every study", "It was exposed as a hoax", "Replications have been mixed", "It only applies to children"], a: 2, explain: "The planning finding (Masicampo & Baumeister, 2011) is limited research, but writing a next step costs little.", tip: "Before you stop work, write the very next action on a sticky note so you can restart fast." },
  { id: "sk22", topic: "skills", headline: "Explain a topic simply, as if to a beginner, to find your gaps", body: "The Feynman technique, named after physicist Richard Feynman: write an explanation of a topic in plain words, as if teaching a newcomer. Where you stall or reach for jargon, you've found a gap. Go back to the source, then simplify again.", q: "In the Feynman technique, what signals a gap in your understanding?", options: ["Using fewer than three examples","Explaining it more slowly than usual","Taking longer than five minutes","Stalling or leaning on jargon"], a: 3, explain: "Explaining forces you to retrieve and organise ideas, which is itself a strong way to learn.", tip: "Pick something you learned this week and explain it in five plain sentences, with no notes." },
  { id: "sk23", topic: "skills", headline: "Guessing answers before you study can help you learn", body: "Trying a quiz on material before you've learned it, even when most of your guesses are wrong, tends to improve how well you learn it afterwards. Researchers think the attempt primes your attention for the answer when it arrives.", q: "What does research on 'pretesting' suggest about guessing before studying?", options: ["It only helps if your guesses are right","It wastes time better spent reading","It tends to improve later learning","It makes the wrong answers stick"], a: 2, explain: "It works best when you see the correct answer soon after making your guess.", tip: "Before reading a chapter, skim its review questions and jot down your best guesses." },
  { id: "sk24", topic: "skills", headline: "Teaching to your 'learning style' doesn't improve learning", body: "Many people believe they're 'visual' or 'auditory' learners. People do have preferences, but reviews have found little evidence that matching teaching to a preferred style improves results. Matching the method to the material works better.", q: "What does research say about matching teaching to a person's 'learning style'?", options: ["It roughly doubles how much you retain","There's little evidence it helps","It only works for visual learners","It's essential for adult learners"], a: 1, explain: "Maps are best learned visually and pronunciation by listening, for nearly everyone.", tip: "Choose study formats by subject: diagrams for anatomy, speaking practice for languages." },
  { id: "sk25", topic: "skills", headline: "Asking 'why is this true?' helps facts stick", body: "Elaborative interrogation means pausing on a fact and explaining why it makes sense, linking it to what you already know. A major 2013 review of study techniques rated it moderately useful, especially for factual material.", q: "What is 'elaborative interrogation', a study technique?", options: ["Asking yourself why a fact is true","Having a friend grill you with questions","Rewriting your notes in your own words","Highlighting key sentences"], a: 0, explain: "The same review rated highlighting and rereading as low utility, despite their popularity with students.", tip: "On your next page of notes, add a 'because...' after three key facts." },
  { id: "sk26", topic: "skills", headline: "Sort flashcards into boxes so you review the hard ones most", body: "In the Leitner system, a card you answer correctly moves up a box and is reviewed less often; miss it and it goes back to box one. Your time automatically goes to what you don't know yet, while known cards get spaced out.", q: "In the Leitner flashcard system, what happens to a card you get wrong?", options: ["It moves up to the next box","It's removed from the deck for good","It goes back to the first box","It stays in its current box"], a: 2, explain: "Flashcard apps like Anki automate the same idea, scheduling each card with an algorithm.", tip: "Label three envelopes 'daily', 'every 3 days' and 'weekly' and sort your flashcards into them." },
  { id: "sk27", topic: "skills", legendary: true, headline: "Pay yourself first: save automatically the day you're paid", body: "Instead of saving whatever is left at month's end (often nothing), set up an automatic transfer to savings on payday. Your spending then adjusts to what's left, and you never have to decide to save each month.", q: "What does the money habit 'pay yourself first' mean?", options: ["Move savings out the day you're paid","Buy yourself a treat on every payday","Pay off all debts before paying rent","Ask for a raise before others do"], a: 0, explain: "Automation removes the willpower step: the money's moved before you're tempted to spend it.", tip: "Set up an automatic transfer of even 5% of your pay to savings for the day after payday." },
  { id: "sk28", topic: "skills", headline: "Compare the unit price, not the sticker price", body: "The bigger pack isn't always cheaper per gram, and 'family size' can cost more per unit than two small packs. Many shelf labels show a price per 100 g, litre or item; compare those numbers instead.", q: "What's the most reliable way to compare value between different pack sizes?", options: ["Choose the biggest pack", "Pick whichever is on promotion", "Go for the store's own brand", "Compare the price per unit"], a: 3, explain: "Check both labels use the same unit; stores sometimes mix per 100 g and per kg.", tip: "On your next shop, check the unit price on three items you buy every week." },
  { id: "sk29", topic: "skills", headline: "Aim for an emergency fund of three to six months of expenses", body: "A widely recommended buffer is 3-6 months of essential spending, kept in an easy-access savings account. It turns a job loss or car repair into an inconvenience instead of a debt spiral. A first target of one month is a fine start.", q: "How big an emergency fund do financial planners commonly recommend?", options: ["Two weeks of take-home pay","One month of take-home pay","3-6 months of expenses","Two years of gross income"], a: 2, explain: "Base it on essentials (rent, food, bills, debt payments), not your whole income, so it's more reachable.", tip: "Add up your bare-minimum monthly costs; that number is your first savings milestone." },
  { id: "sk30", topic: "skills", headline: "Pay your card's full statement balance and you usually owe no interest", body: "Most credit cards give a grace period: pay the full statement balance by the due date and new purchases cost no interest. Pay only the minimum, and interest, often over 20% a year, is charged on the rest.", q: "How can you usually avoid paying interest on credit card purchases?", options: ["Pay the minimum before the due date","Pay the statement balance in full","Keep usage under 30% of your limit","Pay off half the balance each month"], a: 1, explain: "Cash advances usually have no grace period and start charging interest immediately.", tip: "Set up an automatic payment for the full statement balance, not the minimum." },
  { id: "sk31", topic: "skills", headline: "Starting to invest 10 years earlier can more than double the result", body: "Investing $200 a month at 7% a year grows to about $244,000 after 30 years, but about $525,000 after 40. The extra decade adds only $24,000 of your own money; compound growth does the rest.", q: "Why does starting to invest earlier make such a big difference?", options: ["Banks pay young savers more", "Fees are lower for early savers", "Taxes are only charged later", "Growth compounds on past growth"], a: 3, explain: "7% is an illustrative long-run return, not a guarantee; real returns swing from year to year.", tip: "Use a compound interest calculator to compare starting now with starting in five years." },
  { id: "sk32", topic: "skills", headline: "Wait a day before non-essential purchases over a set amount", body: "Impulse buys run on the excitement of the moment, which fades fast. A simple rule like 'anything over $50 waits 24 hours' (or 30 days for big items) gives your future self a vote. Many things stop feeling essential overnight.", q: "What's the main purpose of a '24-hour rule' for purchases?", options: ["To let the impulse fade first","To get a delivery discount","To wait for the price to drop","To avoid overdraft fees on payday"], a: 0, explain: "Deleting saved card details from shopping sites adds the same helpful bit of friction.", tip: "Put the next thing you want in a cart, close the tab and come back to it tomorrow." },
  { id: "sk33", topic: "skills", legendary: true, headline: "Never throw water on a grease fire: smother it instead", body: "Water sinks under burning oil, flashes into steam and throws flaming grease outward. For a small pan fire, fire-safety bodies say turn off the heat, slide a lid over the pan and leave it covered until cool. If it spreads, get out and call for help.", q: "What should you do first with a small grease fire in a pan?", options: ["Turn off heat and cover with a lid","Douse it with a cup of cold water","Carry the pan outside or to the sink","Sprinkle flour over it to smother it"], a: 0, explain: "Baking soda can smother a very small grease fire; flour can't, and may make it worse.", tip: "Whenever you fry, keep a lid that fits the pan within arm's reach." },
  { id: "sk34", topic: "skills", headline: "Never mix bleach with ammonia or acids like vinegar", body: "Bleach plus ammonia (in some glass cleaners) releases toxic chloramine gas; bleach plus acids like vinegar or some toilet cleaners releases chlorine gas. Both can harm your lungs. Use one product at a time and rinse between them.", q: "Which pair of household cleaners should never be mixed because the fumes are toxic?", options: ["Vinegar and baking soda","Dish soap and baking soda","Lemon juice and table salt","Bleach and ammonia cleaner"], a: 3, explain: "Vinegar and baking soda just fizz into water, salt and carbon dioxide: harmless, though they mostly cancel each other out.", tip: "Check the cleaners under your sink and store bleach apart from the others." },
  { id: "sk35", topic: "skills", headline: "Blot stains instead of rubbing, and use cold water on blood", body: "Rubbing pushes a stain deeper and spreads it, so blot from the outside in. Protein stains like blood, egg and dairy should be rinsed in cold water, because hot water can set them. Don't tumble-dry until the stain is gone.", q: "Why should you rinse a fresh blood stain with cold water rather than hot?", options: ["Cold water is more hygienic for blood","Cold water dissolves the iron in blood","Hot water spreads the red colour further","Hot water can set protein stains"], a: 3, explain: "Dryer heat sets most stains, so check the spot is gone before the item goes in.", tip: "Keep a stain remover by the laundry basket and treat stains the same day." },
  { id: "sk36", topic: "skills", headline: "Use a cup plunger on sinks and a flange plunger on toilets", body: "A flat cup plunger seals on a flat sink drain; a flange plunger has an extra rubber sleeve that fits a toilet's curved outlet. On a sink with an overflow hole or a second basin, block that opening with a wet cloth.", q: "When plunging a bathroom sink, why should you block the overflow hole?", options: ["To stop dirty water splashing out","So the pressure pushes on the clog","To keep the plunger cup from slipping","To stop sewer odours escaping"], a: 1, explain: "Have enough water to cover the plunger's cup: pushing water works better than pushing air.", tip: "Check which plunger you own; if it's flat and meant for the toilet, add a flange plunger to your list." },
  { id: "sk37", topic: "skills", headline: "To fold a fitted sheet, tuck its corners inside each other", body: "Hold the sheet inside out with a hand in each of two corners. Fold one corner over the other so they nest, then do the same with the other two. Bring the nested ends together, lay it flat as a rectangle, and fold as normal.", q: "What's the key trick to neatly folding a fitted sheet?", options: ["Tuck the corners inside each other","Iron it flat on a board first","Fold it while it's still slightly damp","Roll it up lengthways from one end"], a: 0, explain: "Store a folded set inside one of its pillowcases to keep the whole set together.", tip: "Practise once on a freshly washed sheet; the motion clicks after a couple of goes." },
  { id: "sk38", topic: "skills", headline: "Jump-starting a car: red, red, black, then black to bare metal", body: "Clamp red to the dead battery's +, then red to the good battery's +. Clamp black to the good battery's -, and the last black clamp to unpainted metal on the dead car, away from the battery. Remove in reverse order.", q: "Where should the final black clamp go when jump-starting a car?", options: ["The dead battery's positive", "The good battery's positive", "Bare metal on the dead car", "The good car's bumper"], a: 2, explain: "Batteries can give off hydrogen gas, so the last connection, which may spark, is made away from the battery.", tip: "Check your car's manual: some cars have dedicated jump-start points under the bonnet." },
  { id: "sk39", topic: "skills", headline: "Your correct tyre pressure is on the door sticker, not the tyre", body: "The number moulded into a tyre's sidewall is its maximum pressure, not the one your car needs. The carmaker's recommended figure is usually on a sticker in the driver's door frame, fuel flap or manual. Check it monthly with tyres cold.", q: "Where do you usually find the recommended tyre pressure for your car?", options: ["A sticker in the driver's door frame","Moulded into the tyre's sidewall","Stamped on the inside of the wheel rim","On a plate under the steering column"], a: 0, explain: "Under-inflated tyres wear faster and waste fuel; driving warms tyres and raises the reading.", tip: "Next time you fill up, check your door-frame sticker and top up at the air pump." },
  { id: "sk40", topic: "skills", headline: "Test smoke alarms monthly and replace them every 10 years", body: "The US National Fire Protection Association advises pressing each alarm's test button monthly and replacing alarms 10 years after the manufacture date printed on the back. Working alarms cut the risk of dying in a home fire by more than half.", q: "How often does the NFPA advise testing home smoke alarms?", options: ["Once a month","Every six months","Once a year","Every 10 years"], a: 0, explain: "A chirp usually means a low battery; never remove a battery without replacing it.", tip: "Set a monthly phone reminder to press the test button on every smoke alarm you have." },
  { id: "sk41", topic: "skills", headline: "Your strongest negotiating tool is a good alternative", body: "Your BATNA, or best alternative to a negotiated agreement, is what you'll do if this deal falls through. The term comes from the book 'Getting to Yes'. A strong alternative, like another job offer, tells you when to walk away.", q: "In negotiation, what does BATNA stand for?", options: ["Bargaining and target number analysis","Best alternative to negotiated agreement","Base agreement terms and negotiated aims","Bottom-line acceptable trade negotiation"], a: 1, explain: "Improve your BATNA before talks, such as getting a second quote, so walking away is a real option.", tip: "Before your next negotiation, write down exactly what you'll do if there's no deal." },
  { id: "sk42", topic: "skills", headline: "In a negotiation, the first number often anchors the outcome", body: "Research finds first offers tend to pull the final deal toward them, because both sides adjust from that starting point. If you've researched the fair range, an ambitious but justifiable first offer can work in your favour.", q: "Why can it pay to make the first offer when you know the market well?", options: ["It's seen as more polite and confident","It anchors talks near your number","It usually ends the talks much faster","It reveals less about your own limits"], a: 1, explain: "If you know little about the value, letting the other side go first can stop you anchoring yourself too low.", tip: "Before talks, research a fair range and set your opening number near its ambitious end." },
  { id: "sk43", topic: "skills", headline: "Negotiate over why people want things, not just what they demand", body: "Two people fight over an orange; one wants the juice, the other just the peel for baking. Splitting it in half wastes value. 'Getting to Yes' advises digging into the interests behind positions, which often reveals trades where both win.", q: "According to 'Getting to Yes', what should negotiators focus on?", options: ["Positions, not interests", "Winning every single point", "Splitting the difference early", "Interests, not positions"], a: 3, explain: "Asking 'What's most important to you here?' is a simple way to uncover interests.", tip: "In your next disagreement, ask 'What matters most to you about this?' before proposing a fix." },
  { id: "sk44", topic: "skills", headline: "Waking at the same time every day anchors your sleep", body: "Sleep experts recommend a consistent wake-up time, weekends included. It keeps your body clock steady, so you get sleepy at a regular hour. Big weekend lie-ins shift your clock later, a kind of mini jet lag called 'social jet lag'.", q: "Which habit do sleep experts emphasise for keeping your body clock steady?", options: ["A consistent wake-up time", "Long weekend lie-ins", "A big meal before bed", "Napping late in the day"], a: 0, explain: "A fixed wake time plus morning daylight is one of the simplest fixes for an erratic sleep pattern.", tip: "Set one wake-up alarm for the same time on all seven days this week." },
  { id: "sk45", topic: "skills", headline: "Caffeine six hours before bed can still cut your sleep", body: "Caffeine's half-life averages around 5 hours, so much of an afternoon coffee can still be in your system at bedtime. In one study, a large dose taken 6 hours before bed cut sleep by over an hour.", q: "Roughly how long is caffeine's average half-life in healthy adults?", options: ["About 30 minutes", "About 5 hours", "About 12 hours", "About 2 days"], a: 1, explain: "It varies a lot between people, roughly 2-10 hours, depending on genes, pregnancy, smoking and some medicines.", tip: "Try a 2 pm caffeine cut-off for a week and notice how you sleep." },
  { id: "sk46", topic: "skills", headline: "Can't sleep? Get out of bed after about 20 minutes", body: "Lying awake in bed teaches your brain that bed is for tossing and turning. Insomnia therapy advises getting up, doing something calm in dim light, and returning only when sleepy. And don't keep checking the clock.", q: "What does insomnia therapy (CBT-I) advise if you can't fall asleep?", options: ["Stay in bed and keep trying","Do a short burst of hard exercise","Get up and return when sleepy","Scroll your phone for a while"], a: 2, explain: "This 'stimulus control' is one of the best-supported parts of cognitive behavioural therapy for insomnia.", tip: "Set up a dim reading spot and a calm book now, so you have somewhere to go on a bad night." },
  { id: "sk47", topic: "skills", headline: "A nightcap may help you nod off but worsens the rest of the night", body: "Alcohol is a sedative, so it can shorten the time it takes to fall asleep. But as your body processes it, sleep becomes lighter and more broken and REM sleep is suppressed, so you can wake less rested.", q: "How does alcohol before bed typically affect sleep?", options: ["Deeper, more restful sleep all night","No effect once you're actually asleep","More dream (REM) sleep through the night","You drop off faster but sleep worse"], a: 3, explain: "It also relaxes throat muscles, which can make snoring worse.", tip: "Leave a few hours between your last drink and bedtime, and compare how you feel." },
  { id: "sk48", topic: "skills", headline: "Abroad, choose to pay in the local currency", body: "Card machines and ATMs abroad often offer to charge you in your home currency. This 'dynamic currency conversion' usually comes with a worse exchange rate than your card provider's. Pick local currency and let your bank convert.", q: "When a card machine abroad offers to charge your home currency, what's usually cheaper?", options: ["Paying in your home currency","Paying in euros or US dollars","Paying in the local currency","Splitting it between both"], a: 2, explain: "Your card may still add a foreign transaction fee; many travel-friendly cards waive it.", tip: "Before your next trip, check whether your card charges foreign transaction fees." },
  { id: "sk49", topic: "skills", headline: "Beat jet lag by living on local time as soon as you land", body: "Light is the strongest signal for resetting your body clock. Get daylight at your destination and switch to local meal and sleep times right away. Most people adjust at roughly a time zone a day, and flying east is usually harder.", q: "Which direction of travel usually causes worse jet lag?", options: ["Flying west, toward the sunset","Flying east, toward the sunrise","Flying north-south on long flights","Neither: only distance matters"], a: 1, explain: "Flying east shortens your day, and most body clocks find it easier to stretch a day than shrink it.", tip: "On your next long flight, set your watch to destination time as soon as you board." },
  { id: "sk50", topic: "skills", headline: "Keep a copy of your passport separate from the real thing", body: "If your passport is lost or stolen, a photo or photocopy of the ID page makes getting an emergency replacement from an embassy or consulate much easier. Keep one copy in secure cloud storage and a paper copy in a different bag.", q: "Why carry a copy of your passport's photo page when travelling?", options: ["It eases a replacement if it's lost","It can be used instead at borders","Most hotels legally require a copy","It speeds you through airport security"], a: 0, explain: "A copy isn't valid for travel, but it gives officials your passport number and details quickly.", tip: "Photograph your passport and your cards' emergency numbers and save them in a secure folder." },
  { id: "sk51", topic: "skills", headline: "A password manager lets every account have a unique password", body: "Reusing a password means one breach can unlock many accounts, because attackers try leaked logins on other sites (credential stuffing). A password manager creates and remembers a different strong password for every site.", q: "Why is reusing one password across many sites dangerous?", options: ["Sites charge for duplicate passwords","Reused passwords expire faster","One breach can unlock many accounts","Sites can detect and ban reused ones"], a: 2, explain: "Protect the password manager itself with a long, unique passphrase and two-factor authentication.", tip: "Install a reputable password manager and give your email account a unique password first." },
  { id: "sk52", topic: "skills", headline: "Turn on two-factor authentication for your email first", body: "Two-factor authentication (2FA) asks for a second proof, like a code from an authenticator app or a security key, so a stolen password alone isn't enough. Start with email: it can be used to reset nearly every other account.", q: "Why is email the most important account to protect with two-factor authentication?", options: ["It can reset your other passwords", "It has the most storage", "It's the most expensive account", "It's the one you check most often"], a: 0, explain: "Authenticator apps and security keys are safer than SMS codes, which SIM-swap scams can intercept.", tip: "Turn on 2FA for your main email account today, using an authenticator app if offered." },
  { id: "sk53", topic: "skills", headline: "Urgency plus a link is the classic sign of a phishing message", body: "Phishing messages pressure you to act fast: 'Your account will be closed', 'Payment failed'. Check the real sender address, hover over links to see where they lead, and when in doubt open the site or app yourself.", q: "What's the safest response to an urgent email asking you to log in via a link?", options: ["Click it quickly before the link expires","Reply and ask the sender if it's genuine","Forward it to friends to check it","Open the site yourself, not the link"], a: 3, explain: "Legitimate banks and services won't ask you to share your password or one-time codes by email or text.", tip: "Hover over (or long-press) the next link in an email and check the real address before tapping." },
  { id: "sk54", topic: "skills", headline: "Back up with the 3-2-1 rule: 3 copies, 2 media, 1 off-site", body: "Keep three copies of important files, on two different kinds of storage (say, your laptop and an external drive), with one copy somewhere else, like the cloud. Then theft, fire, a dead drive or ransomware can't take everything.", q: "In the 3-2-1 backup rule, what does the '1' stand for?", options: ["One password for all backups", "One copy kept off-site", "One backup per year", "One external drive"], a: 1, explain: "Test a restore now and then: a backup you've never restored from is only a hope.", tip: "Turn on automatic cloud backup for your phone's photos today." },
  { id: "sk55", topic: "skills", legendary: true, headline: "Hands-only CPR: push hard and fast to the beat of 'Stayin' Alive'", body: "If an adult collapses and isn't breathing normally, call emergency services, then push hard and fast in the centre of the chest: 100-120 times a minute, at least 5 cm (2 in) deep. 'Stayin' Alive' has roughly the right tempo.", q: "What compression rate is recommended for adult hands-only CPR?", options: ["40-60 per minute", "60-80 per minute", "100-120 per minute", "150-180 per minute"], a: 2, explain: "Let the chest rise fully between pushes, and keep going until help or a defibrillator arrives.", tip: "Play 'Stayin' Alive' and press along to the beat on a cushion for 30 seconds." },
  { id: "sk56", topic: "skills", legendary: true, headline: "Spot a stroke FAST: Face, Arms, Speech, Time to call", body: "Face drooping on one side? Arm weakness, so one drifts down when both are raised? Speech slurred or strange? Time to call emergency services immediately. Stroke treatments work best the sooner they start, so note when symptoms began.", q: "In the FAST check for stroke, what does the T stand for?", options: ["Temperature of the forehead","Time to call an ambulance","Tongue movement to each side","Test their blood sugar levels"], a: 1, explain: "Call even if symptoms fade: they can signal a 'mini-stroke' (TIA), which raises the risk of a major stroke.", tip: "Teach the FAST letters to someone you live with tonight; it takes 30 seconds." },
  { id: "sk57", topic: "skills", headline: "Breathing but unresponsive? Use the recovery position", body: "If someone is unresponsive but breathing normally, and you don't suspect a spinal injury, roll them onto their side, top knee bent, head tilted back. This keeps the airway open and lets vomit drain. Call for help and keep checking breathing.", q: "Why is an unresponsive but breathing person placed in the recovery position?", options: ["To boost blood flow to the legs","To make CPR easier to start","To keep their body warm","To keep their airway open"], a: 3, explain: "If they stop breathing normally, roll them onto their back, call for help and start CPR.", tip: "Watch a short first-aid video on the recovery position and practise it on a willing friend." },
  { id: "sk58", topic: "skills", headline: "Anyone can use a defibrillator: it talks you through each step", body: "Automated external defibrillators (AEDs) in public places are designed for untrained bystanders. Switch it on and follow the voice prompts: it analyses the heart rhythm and only advises a shock if one is needed.", q: "Who are public-access defibrillators (AEDs) designed to be used by?", options: ["Any untrained bystander","Only paramedics and nurses","Anyone with first-aid training","Only the building's staff"], a: 0, explain: "Keep doing CPR while someone fetches the AED, and pause only when it tells you to.", tip: "At work, the gym or your station, look for the AED sign and note where it's kept." },
  { id: "sk59", topic: "skills", headline: "Cool a burn under running water for 20 minutes, not ice or butter", body: "For burns, the UK's NHS advises holding the area under cool or lukewarm running water for 20 minutes, and removing nearby jewellery or clothing unless stuck to the skin. Ice can damage skin further, and butter or oils hold in heat.", q: "What does NHS first-aid guidance advise for cooling a burn?", options: ["An ice pack held on it for 5 minutes","Butter or oil to seal the skin","Cool running water for 20 minutes","A warm, damp towel over the burn"], a: 2, explain: "Then cover it loosely with cling film; get medical help for large, deep, facial or chemical burns.", tip: "If you burn yourself cooking, go straight to the cold tap and set a 20-minute timer." },
