<title>Upscroll</title>
<meta name="description" content="A feed that gives back: bite-size learning with spaced repetition, real-world micro-quests, and a vault for everything on your mind.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Upscroll
   Layout: one phone-width column — header / snapping card feed / HUD dock — floating in a night sky.
   Deliberately single-theme (night). Each card kind tints itself from one --hue so state reads at a glance. */
:root {
  color-scheme: dark;
  --night: #0a0e1b;
  --night-2: #111729;
  --night-3: #1a2140;
  --ink: #eef1fa;
  --ink-2: #bcc3d9;
  --mute: #8b95b3;
  --line: rgba(188, 200, 255, 0.11);
  --line-2: rgba(188, 200, 255, 0.2);
  --gold: #f5c95c;
  --gold-2: #ffe3a1;
  --gold-ink: #2b1d00;
  --good: #62d6a2;
  --bad: #ff7f70;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 16px;
  --col: 540px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(60% 50% at 20% 0%, rgba(70, 90, 190, 0.18), transparent 70%),
    radial-gradient(50% 40% at 90% 100%, rgba(150, 80, 170, 0.12), transparent 70%),
    var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

/* ---------- app frame ---------- */
#app {
  position: relative;
  height: 100%;
  max-width: var(--col);
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  background: var(--night);
  box-shadow: 0 0 0 1px var(--line), 0 30px 120px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}
.top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--night) 88%, transparent);
  z-index: 5;
}
.brand {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 1.12rem;
  letter-spacing: -0.03em;
  display: flex;
  align-items: center;
  gap: 7px;
}
.brand-mark {
  width: 16px; height: 16px; border-radius: 5px;
  background: conic-gradient(from 200deg, var(--gold), #ff9b6b, #b48cff, #5fd0d8, var(--gold));
  box-shadow: 0 0 14px rgba(245, 201, 92, 0.5);
}
body:not([data-tab="feed"]) .filters { visibility: hidden; }
.filters { display: flex; gap: 2px; margin: 0 auto; min-width: 0; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.filter {
  border: 0; background: transparent; color: var(--mute);
  font-size: 0.82rem; font-weight: 700; padding: 5px 10px; border-radius: 999px;
  transition: color 0.2s, background 0.2s;
}
.filter.on { color: var(--night); background: var(--ink); }
.top-right { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center;
  border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04);
  color: var(--ink-2); flex: none;
}
.icon-btn svg, .ico svg { width: 20px; height: 20px; display: block; }
.ico { display: inline-grid; place-items: center; }
.holes-btn { color: #c8b6ff; }
.goal-ring { position: relative; width: 38px; height: 38px; display: grid; place-items: center; }
.goal-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.goal-ring circle { fill: none; stroke-width: 3.2; }
.goal-ring .bg { stroke: rgba(255, 255, 255, 0.09); }
.goal-ring .fg { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 0.8s var(--ease); }
.goal-ring.full .fg { filter: drop-shadow(0 0 4px var(--gold)); }
#goal-num { font-family: var(--f-mono); font-size: 0.66rem; font-weight: 700; color: var(--gold-2); font-variant-numeric: tabular-nums; }

.stage { position: relative; min-height: 0; }
.view { position: absolute; inset: 0; }

/* ---------- feed ---------- */
.feed {
  position: absolute; inset: 0;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  overscroll-behavior: contain;
  overflow-anchor: none;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }
.card {
  position: relative;
  min-height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
  isolation: isolate;
  display: flex;
  flex-direction: column;
}
.card-bg {
  position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(110% 65% at 92% -5%, hsl(var(--hue) 75% 52% / 0.34), transparent 62%),
    radial-gradient(80% 55% at -10% 105%, hsl(calc(var(--hue) + 35) 65% 45% / 0.2), transparent 60%),
    linear-gradient(180deg, hsl(var(--hue) 40% 9%), var(--night) 70%);
}
.card-bg::after {
  content: ""; position: absolute; inset: 0; opacity: 0.05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.card.legendary .card-bg {
  background:
    radial-gradient(100% 60% at 80% 0%, rgba(245, 201, 92, 0.4), transparent 60%),
    radial-gradient(80% 50% at 0% 100%, rgba(255, 140, 90, 0.25), transparent 60%),
    linear-gradient(180deg, #1a1408, var(--night) 75%);
}
.card.legendary { box-shadow: inset 0 0 0 1px rgba(245, 201, 92, 0.35); }
.card-inner {
  position: relative;
  flex: 1;
  display: flex; flex-direction: column; justify-content: center;
  gap: 14px;
  padding: 22px 20px 44px;
}
.card.has-rail .card-inner { padding-right: 74px; }
.card-inner.center { align-items: center; text-align: center; padding-right: 20px; }
.card-inner > * { min-width: 0; }

.eyebrow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }
.chip {
  padding: 4px 9px; border-radius: 999px; font-weight: 700;
  color: hsl(var(--hue) 85% 82%); background: hsl(var(--hue) 70% 55% / 0.16); border: 1px solid hsl(var(--hue) 70% 65% / 0.28);
}
.legendary .chip { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
.topic { color: var(--ink-2); }
.by { color: #c8b6ff; }
.strength { display: inline-flex; gap: 3px; margin-left: auto; }
.strength i { width: 12px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); }
.strength i.on { background: hsl(var(--hue) 85% 70%); box-shadow: 0 0 6px hsl(var(--hue) 85% 60% / 0.6); }

.headline {
  font-family: var(--f-display);
  font-weight: 750;
  font-size: clamp(1.5rem, 6.4vw, 2.15rem);
  line-height: 1.07;
  letter-spacing: -0.022em;
  margin: 0;
  text-wrap: balance;
  font-variation-settings: "opsz" 48;
}
.word-big { font-size: clamp(2.4rem, 12vw, 3.6rem); letter-spacing: -0.035em; color: hsl(var(--hue) 90% 88%); }
.est-q { font-size: clamp(1.4rem, 5.8vw, 1.95rem); }
.body { margin: 0; color: var(--ink-2); font-size: 1.02rem; line-height: 1.5; max-width: 62ch; }
.kicker { margin: 0; font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.06em; color: hsl(var(--hue) 70% 78%); }

/* quiz */
.quiz { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.q { margin: 0; font-weight: 700; font-size: 1rem; line-height: 1.35; }
.opts { display: grid; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%;
  text-align: left; padding: 11px 13px; min-height: 46px;
  border-radius: 14px; border: 1px solid var(--line-2);
  background: rgba(255, 255, 255, 0.045);
  font-size: 0.97rem; line-height: 1.3;
  transition: transform 0.12s var(--ease), background 0.2s, border-color 0.2s, opacity 0.3s;
}
.opt:not(:disabled):hover { background: rgba(255, 255, 255, 0.08); border-color: hsl(var(--hue) 70% 70% / 0.5); }
.opt:not(:disabled):active { transform: scale(0.98); }
.opt-key {
  flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px;
  font-family: var(--f-mono); font-size: 0.72rem; font-weight: 700; color: var(--mute); border: 1px solid var(--line-2);
}
.opt-text { min-width: 0; }
.opt.right { background: color-mix(in srgb, var(--good) 20%, transparent); border-color: var(--good); animation: pop 0.45s var(--ease); }
.opt.right .opt-key { background: var(--good); color: #06281a; border-color: var(--good); }
.opt.wrong { background: color-mix(in srgb, var(--bad) 18%, transparent); border-color: var(--bad); animation: shake 0.4s; }
.opt.wrong .opt-key { background: var(--bad); color: #2d0702; border-color: var(--bad); }
.opt.dim { opacity: 0.4; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; animation: rise 0.4s var(--ease); }
.verdict strong { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: -0.01em; }
.verdict.ok strong { color: var(--good); }
.verdict.no strong { color: var(--bad); }
.verdict-sub { flex-basis: 100%; color: var(--mute); font-size: 0.85rem; }
.xp-pill, .combo-pill {
  font-family: var(--f-mono); font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
  color: var(--gold-ink); background: var(--gold);
}
.combo-pill { background: transparent; color: #ffb38a; border: 1px solid #ffb38a; }
.after { display: flex; flex-direction: column; gap: 8px; animation: rise 0.5s var(--ease); }
.explain, .tip, .example, .origin, .src { margin: 0; font-size: 0.93rem; line-height: 1.45; color: var(--ink-2); }
.tip { padding: 10px 12px; border-radius: 12px; background: rgba(245, 201, 92, 0.08); border: 1px solid rgba(245, 201, 92, 0.25); color: var(--ink); }
.tip b { color: var(--gold); font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 4px; }
.origin b { color: var(--mute); font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 4px; }
.example { font-style: italic; color: var(--ink); }
.src { font-family: var(--f-mono); font-size: 0.72rem; color: var(--mute); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* buttons */
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 46px; padding: 0 18px; border-radius: 14px;
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.06);
  font-weight: 700; font-size: 0.97rem;
  transition: transform 0.12s var(--ease), background 0.2s, opacity 0.2s;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.55; }
.btn.primary { background: var(--ink); color: var(--night); border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: #fff; }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 0.85rem; border-radius: 11px; }
.btn.wide { width: 100%; }
.btn .ico svg { width: 18px; height: 18px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.danger-fill { background: var(--bad); color: #2d0702; border-color: var(--bad); }

/* right rail */
.rail-slot { position: absolute; right: 10px; bottom: 22px; z-index: 4; }
body:not([data-tab="feed"]) .rail-slot { display: none; }
.rail { display: flex; flex-direction: column; gap: 12px; animation: rise 0.3s var(--ease); }
.rail-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: 0; padding: 0; color: var(--ink-2);
  font-family: var(--f-mono); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase;
}
.rail-btn .ico {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(10, 14, 27, 0.55); border: 1px solid var(--line-2);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: transform 0.15s var(--ease), color 0.2s, background 0.2s;
}
.rail-btn:active .ico { transform: scale(0.9); }
.rail-btn.on { color: var(--gold); }
.rail-btn.on .ico { background: rgba(245, 201, 92, 0.16); border-color: rgba(245, 201, 92, 0.5); }
.rail-btn.on .ico svg { fill: currentColor; }
.rail-btn.deep { color: #cdbcff; }

/* estimate */
.est { display: flex; flex-direction: column; gap: 12px; }
.est-readout {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 10vw, 2.9rem); letter-spacing: -0.03em;
  color: hsl(var(--hue) 95% 75%); font-variant-numeric: tabular-nums; line-height: 1;
}
.est-readout.revealed { color: var(--gold); }
.est-track { position: relative; padding: 10px 0; }
.est-slider { width: 100%; appearance: none; -webkit-appearance: none; height: 8px; border-radius: 999px; background: linear-gradient(90deg, hsl(var(--hue) 70% 40% / 0.4), hsl(var(--hue) 90% 60% / 0.7)); outline-offset: 6px; touch-action: none; }
.est-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); border: 4px solid hsl(var(--hue) 90% 60%); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5); }
.est-slider::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); border: 4px solid hsl(var(--hue) 90% 60%); }
.est-answer {
  position: absolute; top: -2px; width: 4px; height: 32px; margin-left: -2px; border-radius: 2px;
  background: var(--gold); box-shadow: 0 0 12px var(--gold); pointer-events: none; animation: rise 0.5s var(--ease);
}
.est-answer::after { content: "answer"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.est-scale { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 0.7rem; color: var(--mute); margin-top: -6px; }

/* steps / timers */
.steps { margin: 0; padding-left: 20px; color: var(--ink-2); display: grid; gap: 4px; }
.steps li::marker { color: hsl(var(--hue) 80% 70%); font-family: var(--f-mono); font-size: 0.8rem; }
.timer-zone, .orb-zone { display: grid; place-items: center; padding: 6px 0; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring-bg { stroke: rgba(255, 255, 255, 0.08); }
.ring-fg { stroke: hsl(var(--hue) 85% 65%); stroke-linecap: round; }
.ring-num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; font-variant-numeric: tabular-nums; }
.result:empty { display: none; }
.result { display: flex; flex-direction: column; gap: 10px; }

.orb { position: relative; width: 190px; height: 190px; display: grid; place-items: center; }
.orb-core {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, hsl(var(--hue) 90% 80%), hsl(var(--hue) 80% 50% / 0.7) 55%, hsl(var(--hue) 80% 40% / 0) 72%);
  transform: scale(0.55); transition: transform 4s ease-in-out;
  box-shadow: 0 0 60px hsl(var(--hue) 90% 60% / 0.35);
}
.orb-label { position: relative; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); }

.captured { margin: 0; padding-left: 18px; color: var(--ink); display: grid; gap: 4px; }
.captured b { color: var(--mute); font-family: var(--f-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; }
.quote {
  margin: 0; padding: 12px 16px; border-left: 3px solid hsl(var(--hue) 70% 70%);
  background: rgba(255, 255, 255, 0.04); border-radius: 0 12px 12px 0; font-size: 1rem; white-space: pre-wrap;
}
.quote.big { font-family: var(--f-display); font-size: clamp(1.25rem, 5vw, 1.6rem); font-weight: 600; line-height: 1.25; }

/* sprint */
.sprint { display: flex; flex-direction: column; gap: 12px; }
.sprint-bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.sprint-bar i { display: block; height: 100%; background: hsl(var(--hue) 85% 60%); transform-origin: left; }
.sprint-score { font-family: var(--f-mono); font-weight: 700; color: hsl(var(--hue) 85% 75%); }
.sprint-score.pop { animation: pop 0.3s var(--ease); }
.sprint-q { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 11vw, 3.2rem); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.sprint-q.shake { animation: shake 0.35s; }
.sprint-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sprint-opt { justify-content: center; font-family: var(--f-mono); font-size: 1.15rem; font-weight: 700; min-height: 60px; }
.sprint-final { font-family: var(--f-display); font-size: 4.5rem; font-weight: 800; line-height: 1; color: hsl(var(--hue) 85% 72%); }

/* chest */
.gem { position: relative; width: 200px; height: 200px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.gem-core {
  width: 112px; height: 112px; transform: rotate(45deg); border-radius: 22px;
  background: conic-gradient(from 30deg, var(--gold), #ff9e6e, #c39bff, #6fd8dd, var(--gold));
  box-shadow: 0 0 40px rgba(245, 201, 92, 0.55), inset 0 0 20px rgba(255, 255, 255, 0.5);
  animation: float 2.6s ease-in-out infinite;
}
.gem-ring { position: absolute; inset: 8px; border-radius: 50%; border: 1px dashed rgba(245, 201, 92, 0.45); animation: spin 14s linear infinite; }
.gem.open .gem-core { animation: burst 0.7s var(--ease) forwards; }
@keyframes float { 0%, 100% { transform: rotate(45deg) translateY(0); } 50% { transform: rotate(45deg) translateY(-8px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes burst { 0% { transform: rotate(45deg) scale(1); } 40% { transform: rotate(135deg) scale(1.3); } 100% { transform: rotate(225deg) scale(0.7); opacity: 0.55; } }

/* brief */
.brief-grid, .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.045); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.76rem; color: var(--mute); line-height: 1.25; }
.quests { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.quests li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); }
.q-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gold); flex: none; }
.quests li.done .q-dot { background: var(--gold); }
.quests li.done { color: var(--mute); text-decoration: line-through; }
.q-xp { margin-left: auto; font-family: var(--f-mono); font-size: 0.72rem; color: var(--gold); }
.swipe-cta { display: flex; align-items: center; gap: 6px; margin: 4px 0 0; color: var(--mute); font-size: 0.9rem; }
.swipe-cta .ico svg { width: 16px; height: 16px; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-4px); } }

/* receipt */
.receipt {
  width: 100%; max-width: 360px; align-self: center; padding: 20px 18px 16px;
  background: #f4efe3; color: #23201a; font-family: var(--f-mono); font-size: 0.82rem;
  border-radius: 6px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  --tooth: 8px;
  mask: radial-gradient(circle at 50% 100%, transparent 4px, #000 4.5px) bottom / var(--tooth) 8px repeat-x, linear-gradient(#000, #000) top / 100% calc(100% - 7px) no-repeat;
  -webkit-mask: radial-gradient(circle at 50% 100%, transparent 4px, #000 4.5px) bottom / var(--tooth) 8px repeat-x, linear-gradient(#000, #000) top / 100% calc(100% - 7px) no-repeat;
  transform: rotate(-1deg);
}
.rc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rc-head b { letter-spacing: 0.2em; }
.rc-head span { font-size: 0.7rem; color: #6d675a; }
.rc-rule { border-top: 1.5px dashed #a59f90; margin: 10px 0; }
.rc-line { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; }
.rc-line i { flex: 1; border-bottom: 1px dotted #b6af9e; transform: translateY(-3px); }
.rc-line b { font-variant-numeric: tabular-nums; }
.rc-foot { margin: 6px 0 4px; text-align: center; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.72rem; }

.swipe-hint {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none;
  font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2);
  animation: nudge 1.6s ease-in-out infinite; z-index: 3;
}
.swipe-arrow { width: 12px; height: 12px; border-left: 2px solid currentColor; border-top: 2px solid currentColor; transform: rotate(45deg); }

/* ---------- dock ---------- */
.dock { border-top: 1px solid var(--line); background: var(--night); z-index: 5; padding-bottom: env(safe-area-inset-bottom, 0px); }
.hud { display: flex; align-items: center; gap: 12px; padding: 8px 14px 4px; }
.streak { display: flex; align-items: center; gap: 4px; color: var(--mute); font-family: var(--f-mono); font-size: 0.85rem; }
.streak svg { width: 18px; height: 18px; }
.streak.lit { color: #ff9c5b; }
.streak.lit svg { filter: drop-shadow(0 0 6px rgba(255, 140, 70, 0.7)); }
.lvl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.lvl-text { display: flex; align-items: baseline; gap: 8px; font-size: 0.75rem; }
.lvl-n { font-family: var(--f-mono); color: var(--mute); }
.lvl-n b { color: var(--ink); }
.lvl-title { font-family: var(--f-display); font-weight: 700; color: var(--gold-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff9b6b, var(--gold)); transform-origin: left; transition: transform 0.7s var(--ease); }
.combo, .boost { font-family: var(--f-mono); font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid #ffb38a; color: #ffb38a; animation: pop 0.3s var(--ease); }
.combo.hot { background: #ff8a5c; color: #2d0d00; border-color: #ff8a5c; box-shadow: 0 0 14px rgba(255, 138, 92, 0.6); }
.boost { border-color: var(--gold); color: var(--gold); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px 8px 6px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; color: var(--mute); font-size: 0.7rem; font-weight: 700; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--ink); }

/* ---------- sky ---------- */
.sky-view { overflow-y: auto; scrollbar-width: thin; }
#sky-canvas { position: sticky; top: 0; display: block; width: 100%; height: 46%; min-height: 240px; background: radial-gradient(80% 90% at 50% 100%, #1b2350, var(--night) 70%); }
.sky-panel { position: relative; padding: 0 16px 40px; margin-top: -60px; display: flex; flex-direction: column; gap: 14px; }
.sky-head { display: flex; flex-direction: column; gap: 6px; }
.sky-title { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 10vw, 3rem); margin: 0; letter-spacing: -0.035em; line-height: 1; color: var(--gold-2); text-shadow: 0 4px 30px rgba(245, 201, 92, 0.35); }
.lvl-line { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 0.75rem; color: var(--mute); }
.lvl-line .bar { flex: 1; }
.sky-lede { margin: 0; color: var(--ink-2); font-size: 0.95rem; max-width: 60ch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.leg { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-2); }
.leg i { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--hue) 80% 72%); box-shadow: 0 0 6px hsl(var(--hue) 80% 60%); }
h4 { margin: 10px 0 0; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; justify-content: start; overflow-x: auto; }
.heat i { width: 13px; height: 13px; border-radius: 3px; background: rgba(255, 255, 255, 0.05); }
.heat .l1 { background: rgba(245, 201, 92, 0.25); }
.heat .l2 { background: rgba(245, 201, 92, 0.5); }
.heat .l3 { background: rgba(245, 201, 92, 0.75); }
.heat .l4 { background: var(--gold); box-shadow: 0 0 6px rgba(245, 201, 92, 0.6); }
.settings { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); margin-top: 8px; }
.label { margin: 8px 0 0; font-size: 0.85rem; font-weight: 700; color: var(--ink-2); }
.hint { margin: 0; font-size: 0.82rem; color: var(--mute); }
.reset-zone { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.04); color: var(--ink-2);
  border-radius: 999px; padding: 7px 13px; font-size: 0.86rem; font-weight: 700; text-align: left;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.chip-btn.on { background: var(--ink); color: var(--night); border-color: var(--ink); }
.chips.big { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chips.big .chip-btn { border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.chips.big .chip-btn span { font-weight: 400; font-size: 0.78rem; color: var(--mute); }
.chips.big .chip-btn.on span { color: #3b4258; }

/* ---------- vault ---------- */
.vault-view { overflow-y: auto; }
.vault { padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
.view-title { font-family: var(--f-display); font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: -0.03em; }
.view-sub { margin: 4px 0 0; color: var(--mute); font-size: 0.9rem; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-btn { flex: none; border: 1px solid var(--line); background: transparent; color: var(--mute); border-radius: 999px; padding: 7px 12px; font-size: 0.85rem; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.seg-btn.on { background: rgba(255, 255, 255, 0.09); color: var(--ink); border-color: var(--line-2); }
.count { font-family: var(--f-mono); font-size: 0.68rem; padding: 1px 6px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); }
.add-row, .ask-row, .hole-form { display: flex; gap: 8px; }
.field {
  flex: 1; min-width: 0; width: 100%; font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 14px; resize: vertical;
}
.field::placeholder { color: var(--mute); }
.field:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245, 201, 92, 0.15); }
.icon-btn.add { width: 48px; height: 48px; background: var(--ink); color: var(--night); border-color: var(--ink); }
.vault-tools { display: flex; gap: 8px; }
.vlist { display: flex; flex-direction: column; gap: 8px; }
.vitem { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); }
.vitem.done .vtext { text-decoration: line-through; color: var(--mute); }
.vmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.vtext { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.vstep { margin: 0; font-size: 0.82rem; color: var(--ink-2); }
.vmeta { margin: 0; font-family: var(--f-mono); font-size: 0.68rem; color: var(--mute); }
.vprompt { margin: 0; font-size: 0.85rem; color: #c8b6ff; }
.vitem.journal { flex-direction: column; gap: 4px; }
.check { width: 28px; height: 28px; flex: none; border-radius: 9px; border: 2px solid var(--line-2); background: transparent; display: grid; place-items: center; color: transparent; padding: 0; }
.check .ico svg { width: 16px; height: 16px; }
.check.on { background: var(--good); border-color: var(--good); color: #06281a; }
.icon-btn.spark { color: #cdbcff; }
.empty { color: var(--mute); text-align: center; padding: 30px 10px; margin: 0; }

/* ---------- sheets ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 50; background: rgba(4, 6, 14, 0.6);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; transition: opacity 0.25s;
}
.scrim.show { opacity: 1; }
.sheet {
  width: 100%; max-width: var(--col); max-height: 78%; display: flex; flex-direction: column;
  background: var(--night-2); border: 1px solid var(--line-2); border-bottom: 0;
  border-radius: 22px 22px 0 0; box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.5);
  transform: translateY(30px); transition: transform 0.3s var(--ease);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.tall { height: 82%; max-height: 82%; }
.scrim.show .sheet { transform: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 10px; }
.sheet-head h3 { margin: 0; font-family: var(--f-display); font-size: 1.3rem; letter-spacing: -0.02em; }
.sheet-body { padding: 0 16px 18px; overflow-y: auto; flex: 1; min-height: 0; }
.compose, .holes, .claude { display: flex; flex-direction: column; gap: 12px; }
.claude { min-height: 100%; }
.lede { margin: 0; color: var(--ink-2); font-size: 0.95rem; }
.notice { margin: 0; padding: 12px 14px; border-radius: 12px; background: rgba(180, 150, 255, 0.08); border: 1px solid rgba(180, 150, 255, 0.25); color: var(--ink-2); font-size: 0.9rem; }
.claude-quote { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; color: #d9cdff; }
.thread { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.claude-out { white-space: pre-wrap; color: var(--ink); font-size: 0.98rem; line-height: 1.55; }
.thinking { margin: 0; color: var(--mute); animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.45; } }
.err { display: block; color: var(--bad); font-size: 0.88rem; }
.me { margin: 0; align-self: flex-end; max-width: 85%; padding: 9px 13px; border-radius: 16px 16px 4px 16px; background: rgba(255, 255, 255, 0.09); }
.claude-foot { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 8px; background: var(--night-2); }
.icon-btn.send { width: 48px; height: 48px; color: var(--night); background: var(--ink); border-color: var(--ink); }
.hole-list { display: flex; flex-direction: column; gap: 8px; }
.hole { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); }
.hole-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hole-main span { font-size: 0.78rem; color: var(--mute); }
.untangle-out { display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); }

/* ---------- onboarding ---------- */
.onboard { position: fixed; inset: 0; z-index: 40; background: var(--night); display: flex; justify-content: center; overflow-y: auto; transition: opacity 0.4s; }
.onboard.leaving { opacity: 0; }
.ob-sky {
  position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 30% 70%, #cfd8ff, transparent),
    radial-gradient(1.5px 1.5px at 72% 30%, #ffe8b0, transparent), radial-gradient(1px 1px at 85% 80%, #fff, transparent),
    radial-gradient(1px 1px at 55% 12%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 45%, #bfe9ff, transparent),
    radial-gradient(1px 1px at 92% 52%, #fff, transparent), radial-gradient(1px 1px at 6% 88%, #ffd6c4, transparent),
    radial-gradient(70% 50% at 50% 110%, rgba(245, 201, 92, 0.18), transparent 70%),
    radial-gradient(60% 40% at 50% -10%, rgba(90, 110, 220, 0.25), transparent 70%);
}
.ob-step { position: relative; width: 100%; max-width: 480px; padding: 48px 20px 32px; display: flex; flex-direction: column; justify-content: center; gap: 16px; min-height: 100%; animation: rise 0.5s var(--ease); }
.ob-kicker { margin: 0; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.ob-title { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 10vw, 3.2rem); line-height: 1; letter-spacing: -0.04em; text-wrap: balance; }
.ob-title.sm { font-size: clamp(1.7rem, 7.5vw, 2.3rem); line-height: 1.05; }
.ob-sub { margin: 0; color: var(--ink-2); }
.ob-list { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 12px; }
.ob-list li { padding-left: 18px; position: relative; color: var(--ink-2); }
.ob-list li::before { content: ""; position: absolute; left: 0; top: 0.55em; width: 7px; height: 7px; border-radius: 2px; background: var(--gold); transform: rotate(45deg); }
.ob-list b { color: var(--ink); }
.ob-dots { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
.ob-dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); transition: width 0.3s; }
.ob-dots i.on { width: 20px; background: var(--gold); }

/* ---------- effects ---------- */
.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
.float-xp {
  position: fixed; z-index: 61; pointer-events: none; transform: translate(-50%, -50%);
  font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; color: var(--gold);
  text-shadow: 0 0 14px rgba(245, 201, 92, 0.7); animation: floatUp 1.1s var(--ease) forwards;
}
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); } 20% { opacity: 1; transform: translate(-50%, -80%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }
.toast {
  position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); z-index: 70;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--night); font-weight: 700; font-size: 0.88rem;
  max-width: calc(100% - 32px); text-align: center; transition: opacity 0.25s, transform 0.25s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.banner {
  position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); z-index: 65;
  transform: translate(-50%, -20px) scale(0.96); opacity: 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 14px 26px; border-radius: 20px; text-align: center;
  background: linear-gradient(160deg, #2a2210, #171106); border: 1px solid rgba(245, 201, 92, 0.5);
  box-shadow: 0 0 50px rgba(245, 201, 92, 0.3), 0 20px 40px rgba(0, 0, 0, 0.5);
  transition: opacity 0.35s, transform 0.45s var(--ease); pointer-events: none; max-width: calc(100% - 32px);
}
.banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.b-kick { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.banner strong { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; color: var(--gold-2); }
.b-sub { font-size: 0.85rem; color: var(--ink-2); }

/* ---------- smaller phones ---------- */
@media (max-height: 700px) {
  .hud { padding-top: 5px; padding-bottom: 2px; }
  .lvl-text { display: none; }
  .tabs { padding-bottom: 2px; }
  .tab { padding: 3px 0; font-size: 0.64rem; }
  .tab svg { width: 20px; height: 20px; }
  .top { padding-top: 6px; padding-bottom: 6px; }
  .brief-grid .stat { padding: 8px 10px; }
  .brief-grid .stat b { font-size: 1.25rem; }
  .quests li { padding: 7px 10px; }
  .rail { gap: 8px; }
  .rail-btn .ico { width: 40px; height: 40px; }
  .card-inner { gap: 10px; padding-top: 16px; padding-bottom: 18px; }
  .headline { font-size: clamp(1.35rem, 5.8vw, 1.8rem); }
  .body { font-size: 0.95rem; }
  .opt { min-height: 42px; padding: 9px 12px; }
  .orb { width: 150px; height: 150px; }
}
@media (max-width: 460px) {
  .brand-word { display: none; }
  .top { gap: 8px; padding-inline: 12px; }
}
@media (max-width: 380px) {
  .filter { padding: 5px 8px; font-size: 0.78rem; }
  .card-inner { padding-right: 66px; }
}
@media (min-width: 700px) {
  body::after {
    content: "\2191 \2193  or  J K to scroll  \00b7  1\2013 4 to answer";
    position: fixed; left: 50%; bottom: 14px; transform: translateX(calc(var(--col) / 2 + 24px));
    font-family: var(--f-mono); font-size: 0.7rem; color: var(--mute); white-space: nowrap;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .feed { scroll-behavior: auto; }
}

/* today's one thing */
.one-thing { display: flex; flex-direction: column; gap: 6px; }
.one-text { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; line-height: 1.2; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(245, 201, 92, 0.4); background: rgba(245, 201, 92, 0.08); }
.one-text.done { text-decoration: line-through; color: var(--mute); }
.k-one .headline { color: var(--gold-2); }

/* Claude-only controls appear once the page knows Claude is available */
.rail-btn.deep, .needs-ai { display: none !important; }
body.has-ai .rail-btn.deep { display: flex !important; }
body.has-ai .needs-ai { display: inline-flex !important; }

.compose-prompt { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; }

/* ask-first fact cards */
.q-head { font-size: clamp(1.45rem, 6vw, 2rem); }
.reveal { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 16px; background: hsl(var(--hue) 50% 50% / 0.08); border: 1px solid hsl(var(--hue) 60% 65% / 0.22); animation: rise 0.45s var(--ease); }
.reveal-head { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; letter-spacing: -0.01em; color: hsl(var(--hue) 85% 86%); text-wrap: balance; }
.reveal .body { font-size: 0.97rem; }

/* ---------- accessibility + polish pass ---------- */
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.card:focus { outline: none; }
.verdict:focus { outline: none; }
.verdict.mid strong { color: var(--gold); }
.opt[aria-disabled] { cursor: default; }
.opt.dim { opacity: 0.55; }
.opt.right .opt-key, .opt.wrong .opt-key { font-size: 0.9rem; }
.ob-step { justify-content: flex-start; padding-top: max(12vh, 48px); }
.ob-step .field { flex: none; }
.ob-title:focus { outline: none; }
.est-answer::after { top: auto; bottom: -18px; }
.est-scale { margin-top: 4px; }
.gem.open .gem-core { animation: burstOpen 0.8s var(--ease) forwards; }
@keyframes burstOpen { 0% { transform: rotate(45deg) scale(1); } 45% { transform: rotate(135deg) scale(1.35); filter: brightness(1.6); } 100% { transform: rotate(225deg) scale(1.15); filter: brightness(1.15); } }
.gem.open .gem-ring { border-style: solid; border-color: rgba(245, 201, 92, 0.7); box-shadow: 0 0 40px rgba(245, 201, 92, 0.4); }
.stat span { hyphens: manual; }
.filters { overflow-x: auto; scrollbar-width: none; flex: 0 1 auto; }
.filters::-webkit-scrollbar { display: none; }
.dock { background: color-mix(in srgb, var(--night) 82%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.bar { height: 6px; }
.float-xp { text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7), 0 0 14px rgba(245, 201, 92, 0.6); }
.sky-panel { background: linear-gradient(to bottom, transparent, var(--night) 110px); padding-top: 24px; }
@media (max-width: 460px) { .brand-word { display: inline; font-size: 0.95rem; } }
@media (max-width: 400px) { .brand-word { display: none; } }
@media (min-width: 700px) {

}

/* keep sheets above the on-screen keyboard */
.scrim { padding-bottom: var(--kb, 0px); }
.sheet { max-height: calc(78% - var(--kb, 0px)); }
.sheet.tall { height: calc(82% - var(--kb, 0px)); max-height: calc(82% - var(--kb, 0px)); }

  .orb { width: 120px; height: 120px; }
  .ring { width: 100px; height: 100px; }
  .gem { width: 140px; height: 140px; }
}

/* rewards, quests, capture, endings */
.btn.sealed { background: linear-gradient(160deg, #2a2210, #171106); border-color: rgba(245, 201, 92, 0.55); color: var(--gold-2); min-width: 140px; }
.center-row { justify-content: center; }
.tomorrow { padding: 12px 14px; border-radius: 14px; border: 1px dashed rgba(245, 201, 92, 0.35); background: rgba(245, 201, 92, 0.05); display: flex; flex-direction: column; gap: 6px; }
.tomorrow ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 3px; font-size: 0.92rem; }
.quests li { padding: 0; }
.quest-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; background: none; text-align: left; font-size: 0.97rem; }
.quest-btn:disabled { opacity: 0.7; }
.q-label { min-width: 0; }
.capture-btn { margin-left: auto; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; border: 1px solid var(--line-2); background: var(--ink); color: var(--night); flex: none; }
.capture-btn svg { width: 18px; height: 18px; }
.streak, .goal-ring { background: none; border: 0; padding: 0; cursor: pointer; }
.end .compose-prompt { font-size: 1.4rem; }
.field.time { flex: 0 0 auto; width: auto; padding: 8px 12px; }
.remind { display: flex; flex-direction: column; gap: 6px; }
.view:has(.card.active.done) .swipe-hint { display: none; }
