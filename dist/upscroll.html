  // ---------- breathe (3) ----------
  { id: "ac53", cat: "breathe", title: "Try box breathing", body: "Inhale, hold, exhale, hold, four seconds each. A steady rhythm gives your attention something simple to follow, which tends to slow everything down.", xp: 25, timer: 0, steps: [], pattern: [["Inhale", 4], ["Hold", 4], ["Exhale", 4], ["Hold", 4]], rounds: 4 },
  { id: "ac54", cat: "breathe", title: "Take a physiological sigh", body: "Two inhales through the nose, the second one topping off, then a long, slow exhale through the mouth. A quick way to settle when you feel wound up.", xp: 20, timer: 0, steps: [], pattern: [["Inhale", 2], ["Inhale more", 1], ["Long exhale", 6]], rounds: 5 },
  { id: "ac55", cat: "breathe", title: "Breathe 4-7-8", body: "In through the nose for 4, hold for 7, out through the mouth for 8. The long exhale is the part that matters. Stop if you feel lightheaded.", xp: 25, timer: 0, steps: [], pattern: [["Inhale", 4], ["Hold", 7], ["Exhale", 8]], rounds: 4 },

  // ---------- focus (5) ----------
  { id: "ac56", cat: "focus", title: "Do a 2-minute tidy", body: "Set the timer and tidy whatever is in front of you until it ends. Two minutes won't fix everything, but you'll be surprised how much it does.", xp: 25, timer: 120, steps: [] },
  { id: "ac57", cat: "focus", title: "Write the first ugly sentence", body: "That thing you need to write? Write its first sentence now, badly. A bad first line is infinitely easier to fix than a blank page.", xp: 30, timer: 60, steps: ["Open the doc or a note", "Write one sentence, any quality", "Stop or keep going, your call"] },
  { id: "ac58", cat: "focus", title: "Process 5 emails", body: "Open your inbox and handle five: reply, archive, or delete. No leaving them for later. Five is small enough to start and big enough to feel.", xp: 30, timer: 180, steps: ["Reply if it takes under 2 minutes", "Archive if it needs nothing", "Delete if it never mattered"] },
  { id: "ac59", cat: "focus", title: "Start the task you're dreading", body: "Work on it for two minutes. That's all. Starting is usually the worst part; once you're in, stopping is optional.", xp: 35, timer: 120, steps: [] },
  { id: "ac60", cat: "focus", title: "Finish one tiny open loop", body: "Something that takes under a minute: fill in the form, confirm the booking, return the item to the right drawer. Do it now and cross it off for good.", xp: 25, timer: 60, steps: [] }
];

window.UP_CONTENT.reflects = [
  { id: "rf01", text: "What would make today a 10?", sub: "One or two specific things. Small counts." },
  { id: "rf02", text: "What's one thing you did this week that you're quietly proud of?", sub: "Nobody else has to know. It can be tiny." },
  { id: "rf03", text: "Who made your life easier lately, and how?", sub: "Name the person and the exact thing they did." },
  { id: "rf04", text: "What's taking more of your energy than it deserves right now?", sub: "A person, a task, a habit, a thought loop." },
  { id: "rf05", text: "What gave you energy today?", sub: "Think of a moment you felt more awake, not less." },
  { id: "rf06", text: "What are you worried about right now?", sub: "Write it down. Later you'll see how it turned out." },
  { id: "rf07", text: "What do you want to be true a year from today?", sub: "One sentence. Be specific enough to check later." },
  { id: "rf08", text: "What's something you changed your mind about recently?", sub: "Big or small. What tipped it?" },
  { id: "rf09", text: "What's a small thing that made you smile today?", sub: "A sound, a message, a stranger, a snack." },
  { id: "rf10", text: "What are you looking forward to?", sub: "This week, this month, this year. Pick one." },
  { id: "rf11", text: "If you had a free Saturday with no obligations, what would you do?", sub: "Morning to night. Your honest answer, not the ideal one." },
  { id: "rf12", text: "What's a skill you'd love to have a year from now?", sub: "And the first tiny step toward it." },
  { id: "rf13", text: "What do you keep saying you'll do but haven't?", sub: "No judgment. Just name it." },
  { id: "rf14", text: "Who do you want to spend more time with?", sub: "What's actually stopping it?" },
  { id: "rf15", text: "What's the best conversation you had this week?", sub: "Who was it with, and what made it good?" },
  { id: "rf16", text: "What's a song, book, or show you're into right now?", sub: "Fun to look back on. What does it say about this moment?" },
  { id: "rf17", text: "What's one thing you'd tell yourself from a year ago?", sub: "Advice, reassurance, or a warning." },
  { id: "rf18", text: "What's a decision you're putting off?", sub: "What's the real reason you haven't decided?" },
  { id: "rf19", text: "What does a good day look like for you right now?", sub: "Not a perfect one. A good, normal one." },
  { id: "rf20", text: "What are you better at than you were a year ago?", sub: "Work, people, cooking, patience. Anything." },
  { id: "rf21", text: "What's something you're grateful for that you usually ignore?", sub: "Running water, a working body, a friend who texts back." },
  { id: "rf22", text: "What's one thing you'd like to stop doing?", sub: "A habit, a commitment, a way of talking to yourself." },
  { id: "rf23", text: "What drained you today, and could you have avoided it?", sub: "Sometimes yes, sometimes no. Worth knowing which." },
  { id: "rf24", text: "Who would you call first with good news?", sub: "Have you told them lately that they're that person?" },
  { id: "rf25", text: "What's your biggest question about your life right now?", sub: "It doesn't need an answer yet. Just ask it clearly." },
  { id: "rf26", text: "What's something hard you got through that you rarely give yourself credit for?", sub: "Past you did that. Name it." },
  { id: "rf27", text: "Where do you feel most like yourself?", sub: "A place, a group of people, an activity." },
  { id: "rf28", text: "What matters most to you this month?", sub: "If only one thing went well, which would you pick?" },
  { id: "rf29", text: "What are you pretending not to know?", sub: "The thing you already suspect but haven't said out loud." },
  { id: "rf30", text: "What's a risk you're glad you took?", sub: "And what almost stopped you?" },
  { id: "rf31", text: "What did you learn this week?", sub: "A fact, a lesson, something about someone you know." },
  { id: "rf32", text: "What's something you want more of in your life?", sub: "Time, quiet, adventure, people, money, sleep." },
  { id: "rf33", text: "Describe your life right now in three words.", sub: "Fun to compare in a few months." },
  { id: "rf34", text: "What's a compliment you received that stuck with you?", sub: "Who said it, and why did it land?" },
  { id: "rf35", text: "What would future you thank you for doing this week?", sub: "Pick something you could actually do." },
  { id: "rf36", text: "What's one thing you're curious about lately?", sub: "A topic, a place, a person, a question." },

    "Comet", "Star", "Binary Star", "Constellation", "Nebula", "Star Cluster", "Galaxy",
    "Supercluster", "Cosmic Web", "Quasar", "Singularity", "Universe",

    try { await pushing; } finally { pushing = null; }
  }
  const pushRemote = debounce(pushNow, 3000);

  function save() {
    state.updatedAt = now();
    trimSeen();
    writeLocalSoon();
    pushRemote();
  }
  function flush() {
    state.updatedAt = state.updatedAt || now();
    writeLocal();
    return pushNow();
  }

  async function readRemote(col) {
    const main = await col.doc("main").get();
    if (!main || !main.exists) return null;
    const m = main.data();
    const counts = m.chunks || {};
    const read = async (name) => {
      const n = counts[name] || 0;
      const snaps = await Promise.all(Array.from({ length: n }, (_, i) => col.doc(name + "-" + i).get()));
      return snaps.flatMap((sn) => (sn && sn.exists && Array.isArray(sn.data().items) ? sn.data().items : []));
    };
    const [srs, vault, journal, ai] = await Promise.all([read("srs"), read("vault"), read("journal"), read("ai")]);
    delete m.chunks;
    return { ...m, srs: Object.fromEntries(srs), vault, journal, ai };
  }

  async function attachDb() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [dbNs, userNs] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!dbNs || !userNs) return;
      const id = await userNs.id();
      if (!id) return;
      db = dbNs;
      userId = id;
      const remote = await readRemote(db.collection("data/users/" + userId));
      let changed = false;
      if (remote) {
        for (const c of remote.ai || []) if (c && c.id && !aiCards[c.id]) { aiCards[c.id] = c; changed = true; aiDirty = true; }
        delete remote.ai;
        changed = absorb(remote) || changed;
        if (changed) writeLocal();
      }
      remoteReady = true;
      await pushNow();
      if (changed) bus.emit("remote", {});
      bus.emit("synced", {});
    } catch (e) {
      console.warn("Upscroll: cloud save unavailable", e && (e.code || e.message));
    }
  }

  // Erase in place (so live references stay valid), and wait for the cloud copy before returning.
  async function reset() {
    const f = fresh();
    for (const k of Object.keys(state)) delete state[k];
    Object.assign(state, f);
    for (const k of Object.keys(aiCards)) delete aiCards[k];
    aiDirty = true;
    state.updatedAt = now();
    writeLocal();
    if (db && userId && remoteReady) {
      const col = db.collection("data/users/" + userId);
      for (const k of Object.keys(lastWritten)) delete lastWritten[k];
      try {
        // overwrite every chunk the old state may have used
        for (const name of ["srs", "vault", "journal", "ai"]) for (let i = 0; i < 12; i++) await col.doc(name + "-" + i).set({ items: [] });
      } catch (e) { /* best effort */ }
      await pushNow();
    }
  }

  load();
  ensureQuests();

  UP.bus = bus;
  Object.defineProperty(UP, "state", { get: () => state, set: (v) => { state = v; }, configurable: true });
  Object.defineProperty(UP, "aiCards", { get: () => aiCards, configurable: true });
  UP.store = {
    save, flush, markAi, attachDb, reset, award, comboHit, comboMult, levelInfo, today, srsGrade, dueReviews, mastered,
    ensureQuests, questProgress, lean, STRONG, addVault, addJournal, streakAlive, MASTERED, STREAK_MIN, TITLES,
    hasCloud: () => !!(db && userId),
  };
})();

/* Upscroll — Claude-powered features (rabbit holes, go deeper, untangle, answer).
   Everything here degrades to "unavailable" when the page is not running inside Claude. */
(function () {
  const UP = window.UP;
  const { bus, now, slug } = UP;

  let sample = null;
  let status = "unknown"; // unknown | ready | denied | none
  const inflight = {};

  async function init() {
    if (!window.claude || !window.claude.use) { status = "none"; bus.emit("ai", status); return; }
    try {
      sample = await window.claude.use("sample");
      status = sample ? "ready" : "none";
    } catch (e) {
      status = "none";
    }
    bus.emit("ai", status);
  }

  function handleError(e) {
    const code = e && e.code;
    if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed") {
      status = "denied";
      bus.emit("ai", status);
      return "Claude features are turned off for this page. You can allow them from the page's permissions menu.";
    }
    if (code === "rate_limited") return "Claude is busy for you right now. Give it a minute and try again.";
    if (code === "session_expired") return "Your Claude session expired. Sign in again to keep digging.";
    if (code === "refused") return "Claude passed on that one. Try wording it differently.";
    if (code === "cancelled") return "";
    if (code === "invalid_json") return "Claude's answer came back garbled. Try again.";
    return "Couldn't reach Claude. Check your connection and try again.";
  }

  const available = () => status === "ready" && !!sample;

  /* ---------- rabbit holes: infinite, progressively deeper cards on any topic ---------- */
  function validCard(c) {
    if (!c || typeof c !== "object") return false;
    c.a = Number(c.a);
    const str = (x) => typeof x === "string" && x.trim().length > 0;
    return str(c.headline) && str(c.body) && str(c.q) &&
      Array.isArray(c.options) && c.options.length >= 3 && c.options.length <= 4 &&
      c.options.every(str) && new Set(c.options.map((o) => o.trim().toLowerCase())).size === c.options.length &&
      Number.isInteger(c.a) && c.a >= 0 && c.a < c.options.length;
  }

  async function digHole(hole, n = 5) {
    if (!available()) throw { code: "unavailable" };
    if (inflight[hole.id]) return inflight[hole.id];
    const done = hole.count || 0;
    const stage = done < 6 ? "foundations a curious beginner needs first" : done < 18 ? "the important intermediate ideas, mechanisms and surprising details" : "advanced, expert-level nuance, edge cases, and the frontier of the topic";
    const recent = (hole.headlines || []).slice(-24);
    const prompt =
      `You write cards for a learning feed that replaces doomscrolling. Topic: "${hole.topic}".\n` +
      `The reader has already done ${done} cards on it. This batch should cover ${stage}, building on what came before, one idea per card, in a sensible teaching order.\n` +
      (recent.length ? `Do NOT repeat these earlier cards:\n- ${recent.join("\n- ")}\n` : "") +
      `Accuracy rules: only include claims you are at least 95% sure of and that experts broadly agree on. Skip myths, contested or fast-changing claims, and anything surprising you can't stand behind; if the honest answer is debated, teach the debate instead. If the topic is practical (a skill, a language, a craft), make cards the reader can use today.\n` +
      `Quiz rules: the card is shown QUESTION FIRST, then the headline and body are revealed, so the question must be a self-contained, intriguing guess the reader can reason about; prefer applying the idea to a new case over restating it. Options must be similar in length and grammar, with distractors that are common misconceptions, and the correct one must not tend to be the longest.\n` +
      `Reply with only a JSON array of ${n} objects with exactly these keys:\n` +
      `{"headline": a surprising or clarifying statement, max 70 chars,\n "body": 1-3 vivid sentences explaining it, max 260 chars,\n "q": a self-contained multiple-choice question testing the idea, max 110 chars,\n "options": 4 short answer strings (max 40 chars), one correct,\n "a": index of the correct option (vary it),\n "explain": one extra detail shown after answering, max 150 chars,\n "tip": a practical "try this" line or ""}\n` +
      `Example: [{"headline":"...","body":"...","q":"...","options":["...","...","...","..."],"a":2,"explain":"...","tip":""}]`;
    const p = (async () => {
      try {
        const arr = await sample.json(prompt, { cache: false });
        const list = (Array.isArray(arr) ? arr : (arr && arr.cards) || []).filter(validCard).slice(0, n);
        const cards = list.map((c, i) => ({
          id: "ai-" + slug(hole.topic) + "-" + (done + i) + "-" + now().toString(36),
          kind: "ai",
          hole: hole.id,
          topic: hole.topic,
          headline: c.headline.slice(0, 120),
          body: c.body.slice(0, 420),
          q: c.q.slice(0, 200),
          options: c.options.map((o) => o.slice(0, 80)),
          a: c.a,
          explain: String(c.explain || "").slice(0, 240),
          tip: String(c.tip || "").slice(0, 200),
          at: now(),
        }));
        for (const c of cards) UP.aiCards[c.id] = c;
        UP.store.markAi();
        hole.count = done + cards.length;
        hole.headlines = (hole.headlines || []).concat(cards.map((c) => c.headline)).slice(-40);
        hole.queue = (hole.queue || []).concat(cards.map((c) => c.id));
        UP.store.save();
        bus.emit("hole", hole);
        return cards;
      } finally {
        delete inflight[hole.id];
      }
    })();
    inflight[hole.id] = p;
    return p;
  }
  const digging = (id) => !!inflight[id];

  /* ---------- go deeper: streamed explanation + follow-up chat ---------- */
  function deeper(card, turns, onText, signal) {
    const context =
      `The reader is scrolling a learning feed and tapped "Go deeper" on this card:\n` +
      `Title: ${card.headline || card.word || card.title}\n${card.body || card.def || ""}\n${card.explain ? "Extra: " + card.explain : ""}\n\n` +
      `Explain the idea in more depth for a curious adult on a phone: the why and how, a concrete example, and one connection to everyday life. ` +
      `Keep it under 180 words, plain text with short paragraphs, no headings, no markdown symbols. If the card contains an error or oversimplification, say so plainly. ` +
      `If they ask a follow-up, answer it directly in the same style.`;
    const input = [{ role: "user", content: context }, ...turns];
    return sample(input, { cache: turns.length ? false : { gcTime: 3600000 }, onText, signal });
  }

  /* ---------- answer a question from the vault ---------- */
  function answer(question, onText, signal) {
    return sample(
      `Answer this question someone saved while scrolling, for a curious adult reading on a phone. Be accurate, concrete and brief (under 150 words), plain text, no markdown. If the honest answer is uncertain or debated, say so.\n\nQuestion: ${question}`,
      { onText, signal, cache: { gcTime: 3600000 } }
    );
  }

  /* ---------- untangle a brain dump into vault items ---------- */
  async function untangle(text) {
    const res = await sample.json(
      `Someone did a quick brain dump on their phone. Split it into separate items and classify each as "task" (something to do), "idea" (an idea, plan, gift, place, thing to try) or "question" (something they wonder about). ` +
      `Rewrite each item as a short clear line (max 80 chars) in their voice. For tasks, add "step": the tiniest first physical action that would get it moving (max 60 chars), else "". ` +
      `Reply with only a JSON array like [{"kind":"task","text":"Book dentist appointment","step":"Find the dentist's number"}].\n\nBrain dump:\n${text.slice(0, 4000)}`,
      { cache: false }
    );
    return (Array.isArray(res) ? res : []).filter((x) => x && typeof x.text === "string" && ["task", "idea", "question"].includes(x.kind));
  }

  /* ---------- expand a saved idea ---------- */
  function expandIdea(idea, onText, signal) {
    return sample(
      `Someone saved this idea in their notes: "${idea}". Give them 3 concrete, small next steps to move it forward this week, and one question that would sharpen it. Numbered lines, plain text, under 110 words.`,
      { onText, signal, cache: { gcTime: 3600000 } }
    );
  }

  UP.ai = { init, available, status: () => status, digHole, digging, deeper, answer, untangle, expandIdea, handleError };
})();

/* Upscroll — the feed algorithm. It optimizes for what you get out of a session, not for time on app. */
(function () {
  const UP = window.UP;
  const { now, DAY, MIN, weighted, pick, rand } = { ...UP, rand: Math.random };

  const C = () => window.UP_CONTENT || {};

  const TOPICS = {
    space: { label: "Space", hue: 230 },
    science: { label: "Science", hue: 190 },
    earth: { label: "Earth", hue: 160 },
    nature: { label: "Nature", hue: 120 },
    body: { label: "Body", hue: 8 },
    history: { label: "History", hue: 35 },
    money: { label: "Money", hue: 50 },
    mind: { label: "Mind", hue: 280 },
    tech: { label: "Tech", hue: 205 },
    culture: { label: "Culture", hue: 330 },
    skills: { label: "Life skills", hue: 140 },
    words: { label: "Words", hue: 345 },
    holes: { label: "Rabbit holes", hue: 265 },
  };

  const GOALS = {
    mind: { label: "Sharpen my mind", sub: "Facts, mental models, estimation" },
    body: { label: "Move more", sub: "Tiny movement breaks between cards" },
    order: { label: "Get my life in order", sub: "Capture tasks, small admin wins" },
    calm: { label: "Feel calmer", sub: "Breathing, journaling, grounding" },
    people: { label: "Stay close to people", sub: "Nudges to reach out" },
    words: { label: "Speak sharper", sub: "Useful words, used well" },
  };

  const FILTERS = {
    mix: null,
    learn: new Set(["fact", "review", "ai", "estimate", "word", "sprint"]),
    do: new Set(["action", "capture", "task", "idea", "breathe"]),
    calm: new Set(["breathe", "reflect", "capsule", "calmaction"]),
  };
  const DO_KINDS = new Set(["action", "breathe", "capture", "reflect", "task", "idea", "capsule", "sprint"]);

  let chestGap = 11, sinceChest = 0, nextChestAt = 11 + Math.floor(rand() * 4);
  let sinceReceipt = 0, sinceReview = 0, sinceOne = 8;
  const sessionUsed = new Set();
  const session = { start: now(), cards: 0, learned: 0, correct: 0, answered: 0, deeds: 0, captures: 0, xp: 0, words: 0, stars: 0 };

  function goals() { return new Set(UP.state.goals || []); }

  function lastKinds(history, n) { return history.slice(-n).map((s) => s.kind); }

  function topicWeight(topic) {
    const st = UP.state;
    const interested = st.interests && st.interests.length ? (st.interests.includes(topic) ? 2.6 : 0.7) : 1;
    const aff = st.affinity[topic] || 0;
    return interested * Math.max(0.2, 1 + 0.22 * aff);
  }

  /* ---------- per-kind item pickers ---------- */
  function pickFact() {
    const facts = C().facts || [];
    const st = UP.state;
    let pool = facts.filter((f) => !st.srs[f.id] && !sessionUsed.has(f.id) && !f.legendary);
    if (!pool.length) pool = facts.filter((f) => !sessionUsed.has(f.id) && !f.legendary);
    if (!pool.length) return null;
    const f = weighted(pool.map((f) => [f, topicWeight(f.topic)]));
    return f && { kind: "fact", id: f.id, data: f };
  }
  function pickLegendary() {
    const facts = (C().facts || []).filter((f) => f.legendary);
    const st = UP.state;
    let pool = facts.filter((f) => !st.srs[f.id] && !sessionUsed.has(f.id));
    if (!pool.length) pool = facts.filter((f) => !sessionUsed.has(f.id));
    if (!pool.length) return null;
    const f = weighted(pool.map((f) => [f, topicWeight(f.topic)]));
    return { kind: "fact", id: f.id, data: f, legendary: true };
  }
  function leastRecent(list, filter) {
    const st = UP.state;
    const pool = list.filter((x) => !sessionUsed.has(x.id) && (!filter || filter(x)));
    if (!pool.length) return null;
    const unseen = pool.filter((x) => !st.seen[x.id]);
    if (unseen.length) return pick(unseen);
    pool.sort((a, b) => (st.seen[a.id] || 0) - (st.seen[b.id] || 0));
    return pick(pool.slice(0, Math.max(1, Math.ceil(pool.length / 4))));
  }
  function pickEstimate() {
    const list = C().estimates || [];
    const e = weightedFresh(list, (x) => topicWeight(x.topic));
    return e && { kind: "estimate", id: e.id, data: e };
  }
  function weightedFresh(list, wfn) {
    const st = UP.state;
    let pool = list.filter((x) => !sessionUsed.has(x.id) && !st.seen[x.id]);
    if (!pool.length) {
      const all = list.filter((x) => !sessionUsed.has(x.id)).sort((a, b) => (st.seen[a.id] || 0) - (st.seen[b.id] || 0));
      pool = all.slice(0, Math.max(1, Math.ceil(all.length / 3)));
    }
    if (!pool.length) return null;
    return weighted(pool.map((x) => [x, wfn ? wfn(x) : 1]));
  }
  function pickWord() {
    const st = UP.state;
    const list = (C().words || []).filter((w) => !st.srs[w.id] && !sessionUsed.has(w.id));
    if (!list.length) return null;
    const w = pick(list);
    return { kind: "word", id: w.id, data: w };
  }
  function pickAction(calmOnly) {
    const g = goals();
    const st = UP.state;
    const hr = new Date().getHours();
    const night = hr >= 22 || hr < 6;
    const snoozed = st.snooze || {};
    const list = (C().actions || []).filter((a) => a.cat !== "breathe" && (!calmOnly || a.cat === "mind") &&
      !(snoozed[a.id] > now()) && !(night && (a.cat === "body" || a.cat === "life" || a.cat === "social")));
    const fresh = list.filter((a) => !sessionUsed.has(a.id) && (!st.seen[a.id] || now() - st.seen[a.id] > 2 * DAY));
    const pool = fresh.length ? fresh : list.filter((a) => !sessionUsed.has(a.id));
    if (!pool.length) return null;
    const catW = { body: g.has("body") ? 3 : 1, life: g.has("order") ? 3 : 1, focus: g.has("order") ? 2.5 : 1, social: g.has("people") ? 3.5 : 0.8, mind: g.has("calm") ? 2.5 : 1 };
    const a = weighted(pool.map((a) => [a, catW[a.cat] || 1]));
    return a && { kind: "action", id: a.id, data: a };
  }
  function pickBreathe() {
    const a = leastRecent((C().actions || []).filter((x) => x.cat === "breathe"));
    return a && { kind: "breathe", id: a.id, data: a };
  }
  function pickCapture() {
    const c = leastRecent(C().captures || []);
    return c && { kind: "capture", id: c.id, data: c };
  }
  function pickReflect() {
    const r = leastRecent(C().reflects || []);
    return r && { kind: "reflect", id: r.id, data: r };
  }
  function openTasks() {
    const ot = UP.state.oneThing;
    const oneId = ot && ot.day === UP.dayKey() ? ot.vid : null;
    return UP.state.vault.filter((v) => v.kind === "task" && v.id !== oneId && !v.done && !v.archived && now() - v.createdAt > 20 * MIN && (!v.r || now() - v.r > 20 * 3600000) && !sessionUsed.has(v.id));
  }
  function staleIdeas() {
    return UP.state.vault.filter((v) => v.kind === "idea" && !v.archived && now() - v.createdAt > 20 * 3600000 && (!v.r || now() - v.r > 5 * DAY) && !sessionUsed.has(v.id));
  }
  function capsules() {
    return UP.state.journal.filter((j) => now() - j.createdAt > 20 * 3600000 && (!j.back || now() - j.back > 10 * DAY) && !sessionUsed.has(j.id));
  }
  const learnedAt = new Map(); // id -> history index when first learned this session
  function noteLearned(id) { learnedAt.set(id, histLen); }
  function freshDue() {
    const out = [];
    for (const [id, i] of learnedAt) {
      const r = UP.state.srs[id];
      if (r && r.n === 1 && histLen - i >= 9) out.push(id);
    }
    return out;
  }
  function pickReview() {
    const fresh = freshDue();
    for (const id of fresh) learnedAt.delete(id);
    const due = [...fresh, ...UP.store.dueReviews()].filter((id, i, arr) => arr.indexOf(id) === i && !recentlyShown(id));
    for (const id of due) {
      const data = findItem(id);
      if (data) return { kind: "review", id, data, src: data.__kind };
    }
    return null;
  }
  const shownAt = new Map(); // id -> card index in this session
  let histLen = 0;
  function recentlyShown(id) {
    const i = shownAt.get(id);
    return i != null && histLen - i < 6;
  }
  function findItem(id) {
    const c = C();
    if (id.startsWith("ai-")) {
      const a = UP.aiCards[id];
      return a ? { ...a, __kind: "ai" } : null;
    }
    const f = (c.facts || []).find((x) => x.id === id);
    if (f) return { ...f, __kind: "fact" };
    const w = (c.words || []).find((x) => x.id === id);
    if (w) return { ...w, __kind: "word" };
    return null;
  }
  function pickHoleCard() {
    const holes = UP.state.holes.filter((h) => h.active && h.queue && h.queue.length);
    if (!holes.length) return null;
    const h = pick(holes);
    while (h.queue.length) {
      const id = h.queue.shift();
      const card = UP.aiCards[id];
      if (card) { UP.store.save(); return { kind: "ai", id, data: card }; }
    }
    return null;
  }

  /* ---------- the mixer ---------- */
  function next(history, filter = "mix") {
    histLen = history.length;
    const allow = FILTERS[filter];
    const ok = (k) => !allow || allow.has(k);
    const st = UP.state;
    let spec = null;

    const newUser = (st.stats.answered || 0) < 6 && session.cards < 8;
    const firstEver = !st.lastBrief && (st.stats.cards || 0) < 3;
    const histK = lastKinds(history, 3);

    // the daily brief opens each day, except a brand-new user's very first session (hook first)
    if (st.lastBrief !== UP.dayKey() && !history.length && !firstEver) {
      spec = { kind: "brief", id: "brief-" + UP.dayKey() };
    }
    // a brand-new user's first three cards are scripted: a jaw-dropper, an estimate, a guaranteed bonus
    if (!spec && firstEver && history.length < 3 && filter === "mix") {
      spec = [pickLegendary, pickEstimate, () => ({ kind: "chest", id: UP.uid("chest") })][history.length]();
    }
    const ot = st.oneThing;
    if (!spec && ot && ot.day === UP.dayKey() && !ot.done && sinceOne >= 16 && filter !== "learn") {
      spec = { kind: "one", id: "one-" + sinceOne + "-" + session.cards };
      sinceOne = 0;
    }
    if (!spec && sinceChest >= nextChestAt && filter !== "calm") {
      spec = { kind: "chest", id: UP.uid("chest") };
    }
    if (!spec && sinceReceipt >= 24 && session.cards >= 24 && filter !== "calm") {
      spec = { kind: "receipt", id: UP.uid("receipt") };
    }
    // memory checks: never two in a row, at most about one in four cards
    if (!spec && ok("review") && histK[histK.length - 1] !== "review") {
      const recent = lastKinds(history, 8).filter((k) => k === "review").length;
      const dueCount = UP.store.dueReviews().length + freshDue().length;
      const cap = dueCount > 15 ? 3 : 2; // a big backlog earns a little more room
      if (dueCount && recent < cap && (sinceReview >= 4 || rand() < 0.2 + Math.min(0.2, dueCount * 0.015))) spec = pickReview();
    }
    // in Calm, breathing comes round at least every fourth card
    if (!spec && filter === "calm" && !lastKinds(history, 3).includes("breathe")) spec = pickBreathe();
    if (!spec) {
      const g = goals();
      const ka = (k) => Math.max(0.3, 1 + 0.15 * (st.kindAffinity[k] || 0));
      const holesReady = st.holes.filter((h) => h.active && h.queue && h.queue.length).length;
      const W = {
        fact: 30 * (g.has("mind") ? 1.3 : 1) * (UP.store.dueReviews().length > 20 ? 0.6 : 1),
        ai: holesReady ? 26 + 6 * holesReady : 0,
        estimate: 10 * (g.has("mind") ? 1.5 : 1),
        word: 7 * (g.has("words") ? 3 : 1),
        action: 11 * (g.has("body") || g.has("order") || g.has("people") ? 1.4 : 1),
        breathe: 2.5 * (g.has("calm") ? 2.5 : 1),
        capture: 4 * (g.has("order") ? 2 : 1),
        reflect: 3.5 * (g.has("calm") ? 2 : 1),
        sprint: 3.5 * (g.has("mind") ? 1.5 : 1),
        task: openTasks().length ? 7 : 0,
        idea: staleIdeas().length ? 3 : 0,
        capsule: capsules().length ? 3 : 0,
        calmaction: filter === "calm" ? 4 : 0,
      };
      // open daily quests pull their card types forward so every quest is reachable
      const QK = { sprint: "sprint", breathe: "breathe", bullseye: "estimate", reflect: "reflect", capture: "capture", word: "word", deed: "action" };
      for (const q of (st.quests && st.quests.list) || []) if (!q.done && QK[q.type] && W[QK[q.type]]) W[QK[q.type]] *= 2.6;
      // hook before homework: no chores in the first cards of a session, or for brand-new users
      if (session.cards + history.length < 5 || newUser) for (const k of ["capture", "reflect", "task", "idea", "capsule"]) W[k] = 0;
      if (newUser) W.action *= 0.4;
      // no kind twice within the last three cards
      for (const k of histK) if (k in W) W[k] = 0;
      const lastDo = DO_KINDS.has(histK[histK.length - 1]);
      for (const k of Object.keys(W)) {
        if (!ok(k)) W[k] = 0;
        else {
          W[k] *= ka(k);
          if (lastDo && DO_KINDS.has(k) && filter === "mix") W[k] *= 0.25;
        }
      }
      for (let tries = 0; tries < 10 && !spec; tries++) {
        const kind = weighted(Object.entries(W));
        if (!kind) break;
        spec = build(kind);
        if (!spec) W[kind] = 0;
      }
    }
    if (!spec) {
      // everything has been shown this session: let older items come back
      sessionUsed.clear();
      spec = build(allow && allow.has("fact") ? "fact" : filter === "calm" ? "breathe" : filter === "do" ? "action" : "fact") || pickFact() || pickAction() || { kind: "chest", id: UP.uid("chest") };
    }

    // bookkeeping
    if (spec.kind === "chest") { sinceChest = 0; chestGap = Math.min(22, chestGap + 2); nextChestAt = chestGap + Math.floor(rand() * 5); } else sinceChest++;
    if (spec.kind === "receipt") sinceReceipt = 0; else sinceReceipt++;
    if (spec.kind === "review") sinceReview = 0; else sinceReview++;
    if (spec.kind !== "one") sinceOne++;
    if (spec.id) { sessionUsed.add(spec.id); shownAt.set(spec.id, history.length); }
    spec.key = UP.uid("c");
    return spec;
  }

  // a finished real-world quest sometimes earns a bonus right away: reward doing, not swiping
  function deedDone() {
    if (rand() < 0.35) sinceChest = Math.max(sinceChest, nextChestAt);
  }

  function build(kind) {
    switch (kind) {
      case "fact": return pickFact();
      case "ai": return pickHoleCard();
      case "estimate": return pickEstimate();
      case "word": return pickWord();
      case "action": return pickAction(false);
      case "calmaction": return pickAction(true);
      case "breathe": return pickBreathe();
      case "capture": return pickCapture();
      case "reflect": return pickReflect();
      case "sprint": return { kind: "sprint", id: UP.uid("sprint") };
      case "task": { const t = pick(openTasks()); return t && { kind: "task", id: t.id, data: t }; }
      case "idea": { const t = pick(staleIdeas()); return t && { kind: "idea", id: t.id, data: t }; }
      case "capsule": { const j = pick(capsules()); return j && { kind: "capsule", id: j.id, data: j }; }
      case "review": return pickReview();
    }
    return null;
  }

  // distractors come from the same part of speech, so grammar never gives the answer away
  function wordOptions(word) {
    const all = (C().words || []).filter((w) => w.id !== word.id);
    const same = UP.shuffle(all.filter((w) => w.pos === word.pos));
    const pool = same.length >= 3 ? same : same.concat(UP.shuffle(all.filter((w) => w.pos !== word.pos)));
    const opts = UP.shuffle([word.def, ...pool.slice(0, 3).map((w) => w.def)]);
    return { options: opts, a: opts.indexOf(word.def) };
  }
  // the reverse direction: see the meaning, recall the word
  function wordReverse(word) {
    const all = (C().words || []).filter((w) => w.id !== word.id);
    const same = UP.shuffle(all.filter((w) => w.pos === word.pos));
    const pool = same.length >= 3 ? same : same.concat(UP.shuffle(all));
    const opts = UP.shuffle([word.word, ...pool.slice(0, 3).map((w) => w.word)]);
    return { options: opts, a: opts.indexOf(word.word) };
  }

  UP.engine = { next, TOPICS, GOALS, FILTERS, session, pickLegendary, findItem, wordOptions, wordReverse, holesNeedingCards, noteLearned, deedDone, build };

  function holesNeedingCards() {
    return UP.state.holes.filter((h) => h.active && (!h.queue || h.queue.length < 3) && !UP.ai.digging(h.id));
  }
})();

(function () {

    estimate: { label: "Calibrate", hue: 36 },

    capture: { label: "Capture", hue: 95 },
    reflect: { label: "Journal", hue: 255 },
    task: { label: "From your vault", hue: 95 },

  /* ---------- multiple choice ---------- */

  /* ---------- fact + rabbit-hole ---------- */

    const el = frame(spec, {
      topic: isAi ? d.topic : topicOf(d),

  /* ---------- memory check (spaced repetition) ---------- */
  function review(spec) {
    const d = spec.data;
    const isWord = d.__kind === "word";
    const r = UP.state.srs[spec.id] || { b: 0, f: now() };
    const strength = h("span", { class: "strength", title: "Memory strength" },
      ...Array.from({ length: 7 }, (_, i) => h("i", { class: i < r.b ? "on" : "" })));
    const el = frame(spec, { topic: isWord ? "Words" : d.__kind === "ai" ? d.topic : topicOf(d), topicKey: isWord ? "words" : d.topic, meta: strength, hue: 212 });
    const inner = el._inner;
    inner.append(h("p", { class: "kicker" }, "You learned this " + timeAgo(r.f || now()) + ". Still got it?"));
    let q, options, a;
    if (isWord && r.b >= 2 && Math.random() < 0.6) {
      const wo = engine.wordReverse(d);

      q, options, a,
      onAnswer(ok, btn) {

        const rr = store.srsGrade(spec.id, ok, d.__kind);

  /* ---------- word ---------- */
  function word(spec) {

  }

  /* ---------- calibrate (estimation) ---------- */
  function estimate(spec) {
    const d = spec.data;
    const el = frame(spec, { topic: topicOf(d), topicKey: d.topic });
    const inner = el._inner;
    const lo = d.log ? Math.log10(Math.max(d.min, 1e-9)) : d.min;
    const hi = d.log ? Math.log10(d.max) : d.max;
    const toVal = (p) => { const x = lo + (hi - lo) * p; return d.log ? Math.pow(10, x) : x; };
    const toPos = (v) => clamp(((d.log ? Math.log10(v) : v) - lo) / (hi - lo), 0, 1);
    const nice = (v) => {
      if (v === 0) return 0;
      const p = Math.pow(10, Math.floor(Math.log10(Math.abs(v))) - 1); // 2 significant figures
      return Number((Math.round(v / p) * p).toPrecision(2));
    };
    // start somewhere random so the slider's midpoint never hints at the answer
    const startPos = 0.2 + Math.random() * 0.6;
    let guess = nice(toVal(startPos));
    inner.append(h("h2", { class: "headline est-q" }, d.q));
    const readout = h("div", { class: "est-readout" }, fmtNum(guess, d.unit));
    const slider = h("input", { type: "range", min: "0", max: "1000", value: String(Math.round(startPos * 1000)), class: "est-slider", "aria-label": "Your estimate", id: "est-" + spec.key });
    const scale = h("div", { class: "est-scale" }, h("span", null, fmtNum(d.min, d.unit)), h("span", null, fmtNum(d.max, d.unit)));
    const track = h("div", { class: "est-track" }, slider, h("i", { class: "est-answer", hidden: true }));
    slider.addEventListener("input", () => {
      guess = nice(toVal(slider.value / 1000));
      readout.textContent = fmtNum(guess, d.unit);
      slider.setAttribute("aria-valuetext", fmtNum(guess, d.unit));
      if (Math.random() < 0.3) sfx.tick();
    });
    // keep vertical swipes from being eaten by the slider on touch screens
    slider.addEventListener("touchstart", (e) => e.stopPropagation(), { passive: true });
    const lock = h("button", { class: "btn primary" }, "Lock in my guess");
    const box = h("div", { class: "est" }, readout, track, scale, lock);
    inner.append(box);
    lock.addEventListener("click", () => {
      slider.disabled = true;
      lock.remove();
      const ans = d.answer;
      let acc, ratio = null;
      if (d.log && ans > 0 && guess > 0) {
        ratio = Math.max(guess / ans, ans / guess);
        acc = clamp(1 - Math.log10(ratio) / 1.2, 0, 1);
      } else {
        const err = Math.abs(guess - ans) / (d.max - d.min);
        acc = clamp(1 - err * 3, 0, 1);
      }
      const pctOff = ans !== 0 ? Math.abs(guess - ans) / Math.abs(ans) : 0;
      const st = UP.state;
      st.stats.estimates++;
      st.stats.estErr += pctOff > 5 ? 5 : pctOff;
      let label;
      if (pctOff <= 0.1) label = "Bullseye.";
      else if (pctOff <= 0.25) label = "Sharp.";
      else if (ratio ? ratio <= 2 : pctOff <= 0.5) label = "Ballpark.";
      else if (ratio ? ratio <= 10 : pctOff <= 1) label = "Right order of magnitude.";
      else label = "Way off. Now you know.";
      const ok = pctOff <= 0.25;
      const tier = ok ? "ok" : (ratio ? ratio <= 10 : pctOff <= 1) ? "mid" : "no";
      if (ok) { st.stats.bullseyes++; store.questProgress("bullseye"); }
      S.answered++; if (ok) S.correct++;
      const amt = gain(4 + Math.round(acc * 22), readout, "Estimate");
      ok ? sfx.good(3) : sfx.tick();
      if (ok) UP.ui.burst(readout, 18);
      const mark = track.querySelector(".est-answer");
      mark.hidden = false;
      mark.style.left = toPos(ans) * 100 + "%";
      readout.classList.add("revealed");
      UP.ui.countUp(readout, guess, ans, d.unit);
      const offText = ratio && ratio >= 2 ? "Off by " + (Math.round(ratio * 10) / 10) + "x" : "Off by " + Math.round(pctOff * 100) + "%";
      box.append(
        h("div", { class: "verdict " + tier, tabindex: "-1" }, h("strong", null, label), h("span", { class: "xp-pill" }, "+" + amt + " XP"), h("span", { class: "verdict-sub" }, "You said " + fmtNum(guess, d.unit) + ". " + offText + ".")),
        h("div", { class: "after" }, h("p", { class: "explain" }, d.explain), d.src ? h("p", { class: "src" }, "Source: " + d.src) : null)
      );

  /* ---------- math sprint ---------- */
  function sprint(spec) {
    const el = frame(spec, { topic: "30 seconds", topicKey: "sprint" });
    const inner = el._inner;
    const best = UP.state.stats.sprintBest || 0;
    inner.append(h("h2", { class: "headline" }, "How many can you get in 30 seconds?"), h("p", { class: "body" }, best ? "Your best is " + best + ". Mental math keeps working memory in shape." : "Mental math keeps working memory in shape. Tap the right answer, fast."));
    const zone = h("div", { class: "sprint" });
    const start = h("button", { class: "btn primary" }, "Start sprint");
    zone.append(start);
    inner.append(zone);
    let running = false, raf = null;
    function problem(level) {
      const ops = level < 4 ? ["+", "-"] : ["+", "-", "×"];
      const op = UP.pick(ops);
      let a, b, ans;
      const big = 10 + level * 6;
      if (op === "+") { a = 2 + Math.floor(Math.random() * big); b = 2 + Math.floor(Math.random() * big); ans = a + b; }
      else if (op === "-") { a = 5 + Math.floor(Math.random() * big); b = 1 + Math.floor(Math.random() * a); ans = a - b; }
      else { a = 2 + Math.floor(Math.random() * Math.min(12, 3 + level)); b = 2 + Math.floor(Math.random() * 9); ans = a * b; }
      const opts = new Set([ans]);
      while (opts.size < 3) {
        const delta = UP.pick([-10, -2, -1, 1, 2, 10, op === "×" ? a : 3]);
        const v = ans + delta;
        if (v >= 0) opts.add(v);
      }
      return { text: a + " " + op + " " + b, ans, opts: UP.shuffle([...opts]) };
    }
    start.addEventListener("click", () => {
      if (running) return;
      running = true;
      let score = 0, level = 0;
      const total = 30;
      const t0 = performance.now();
      zone.innerHTML = "";
      const bar = h("div", { class: "sprint-bar" }, h("i"));
      const scoreEl = h("div", { class: "sprint-score" }, "0");
      const qEl = h("div", { class: "sprint-q" });
      const opts = h("div", { class: "sprint-opts" });
      zone.append(bar, scoreEl, qEl, opts);
      let cur;
      const show = () => {
        cur = problem(level);
        qEl.textContent = cur.text;
        opts.innerHTML = "";
        cur.opts.forEach((o) => {
          const b = h("button", { class: "opt sprint-opt" }, String(o));
          b.addEventListener("click", () => {
            if (!running) return;
            if (o === cur.ans) { score++; level++; sfx.good(Math.min(score, 12)); buzz(6); scoreEl.textContent = String(score); scoreEl.classList.remove("pop"); void scoreEl.offsetWidth; scoreEl.classList.add("pop"); }
            else { sfx.bad(); buzz([10, 20, 10]); level = Math.max(0, level - 2); qEl.classList.remove("shake"); void qEl.offsetWidth; qEl.classList.add("shake"); }
            show();
          });
          opts.append(b);
        });
      };
      show();
      const tick = () => {
        const left = total - (performance.now() - t0) / 1000;
        bar.firstChild.style.transform = "scaleX(" + Math.max(0, left / total) + ")";
        if (left <= 0) return finish();
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      finishNow = finish;
      function finish() {
        if (!running) return;
        running = false;
        const st = UP.state;
        const prev = st.stats.sprintBest || 0;
        st.stats.sprints++;
        st.stats.sprintBest = Math.max(prev, score);
        store.questProgress("sprint");
        zone.innerHTML = "";
        const amt = gain(5 + score * 2, zone, "Sprint");
        const isBest = score > prev;
        if (isBest && score > 0) { UP.ui.confetti(zone); sfx.level(); }
        zone.append(
          h("div", { class: "sprint-final" }, String(score)),
          h("div", { class: "verdict ok" }, h("strong", null, isBest && prev ? "New personal best." : score >= 15 ? "Lightning." : "Done."), h("span", { class: "xp-pill" }, "+" + amt + " XP"), h("span", { class: "verdict-sub" }, "Best: " + st.stats.sprintBest))
        );
        el.classList.add("done");
      }
    });
    let finishNow = null;
    el._leave = () => { if (running && finishNow) { cancelAnimationFrame(raf); finishNow(); } };
    return el;
  }

/* Upscroll — "Your sky": every card you learn becomes a star; mastered ones shine and join constellations. */
(function () {
  const UP = window.UP;

  const TOPIC_HUES = Object.fromEntries(Object.entries(engine.TOPICS).map(([k, v]) => [k, v.hue]));

  function topicOfId(id, rec) {
    if (rec && rec.k === "word") return "words";
    if (rec && rec.k === "ai") return "holes";

  }

  function buildStars() {
    const st = UP.state;
    const topics = Object.keys(engine.TOPICS);

      const topic = topicOfId(id, r);
      const ti = Math.max(0, topics.indexOf(topic));
      // each topic owns a region of the sky so constellations form naturally
      const rng = mulberry(hash(id));

      const cy = 0.18 + (((ti * 0.61) % 1) * 0.56);
      const ang = rng() * Math.PI * 2, rad = Math.sqrt(rng()) * 0.16;
      return {
        id, topic, b: r.b, f: r.f || 0,
        x: Math.min(0.94, Math.max(0.06, cx + Math.cos(ang) * rad)),
        y: Math.min(0.88, Math.max(0.08, cy + Math.sin(ang) * rad * 1.3)),
        hue: TOPIC_HUES[topic] != null ? TOPIC_HUES[topic] : 200,

/* ---- src/js/vault.js ---- */
/* Upscroll — the Vault: everything the feed pulled out of your head. */
(function () {
  const UP = window.UP;
  const { $, h, icon, store, timeAgo, now } = UP;

  const TABS = [
    { key: "task", label: "To-dos", empty: "Nothing on your list. Capture cards in the feed fill this up, or add one above." },
    { key: "idea", label: "Ideas", empty: "Ideas you save come back to you in the feed later." },
    { key: "question", label: "Questions", empty: "Curious about something? Park it here and ask Claude later." },
    { key: "journal", label: "Journal", empty: "Journal cards in the feed land here as time capsules." },
    { key: "saved", label: "Saved", empty: "Tap Save on any card to keep it here." },
  ];
  let tab = "task";
  let shown = 100;

  function counts() {
    const st = UP.state;
    const c = { task: 0, idea: 0, question: 0, saved: 0, journal: st.journal.length };
    for (const v of st.vault) if (!v.archived && !(v.kind === "task" && v.done)) c[v.kind] = (c[v.kind] || 0) + 1;
    return c;
  }

  function render() {
    const root = $("#vault");
    root.innerHTML = "";
    const c = counts();
    const seg = h("div", { class: "seg", role: "group", "aria-label": "Vault sections" }, ...TABS.map((t) => {
      const b = h("button", { class: "seg-btn" + (tab === t.key ? " on" : ""), "aria-pressed": String(tab === t.key) }, t.label, c[t.key] ? h("span", { class: "count" }, String(c[t.key])) : null);
      b.addEventListener("click", () => { tab = t.key; shown = 100; render(); });
      return b;
    }));
    const head = h("div", { class: "vault-head" },
      h("h2", { class: "view-title" }, "Vault"),
      h("p", { class: "view-sub" }, "Your feed pulls things out of your head and keeps them here. To-dos come back to you until they're done.")
    );
    root.append(head, seg);

    if (tab !== "journal" && tab !== "saved") {
      const id = "vault-add-" + tab;
      const input = h("input", { id, class: "field", placeholder: tab === "task" ? "Add a to-do" : tab === "idea" ? "Add an idea" : "Add a question", maxlength: "300", "aria-label": "Add to " + tab });
      const add = h("button", { class: "icon-btn add", type: "submit", "aria-label": "Add" }, icon("plus"));
      const form = h("form", { class: "add-row" }, input, add);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!input.value.trim()) return;
        store.addVault(tab, input.value);
        UP.state.stats.captures++;
        store.questProgress("capture");
        input.value = "";
        render();
        setTimeout(() => $("#" + id) && $("#" + id).focus(), 0);
      });
      root.append(form);
      {
        const unt = h("button", { class: "btn ghost small needs-ai" }, icon("spark"), "Untangle a brain dump");
        unt.addEventListener("click", untangle);
        root.append(h("div", { class: "vault-tools" }, unt));
      }
    }

    const list = h("div", { class: "vlist" });
    const st = UP.state;
    if (tab === "journal") {
      for (const j of st.journal) {
        list.append(h("article", { class: "vitem journal" },
          h("p", { class: "vmeta" }, timeAgo(j.createdAt)),
          h("p", { class: "vprompt" }, j.prompt),
          h("p", { class: "vtext" }, j.text)));
      }
    } else {
      const items = st.vault.filter((v) => v.kind === tab && !v.archived);
      items.sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || b.createdAt - a.createdAt);
      for (const v of items.slice(0, shown)) list.append(item(v));
      if (items.length > shown) {
        const more = h("button", { class: "btn ghost small" }, "Show " + Math.min(100, items.length - shown) + " more");
        more.addEventListener("click", () => { shown += 100; render(); });
        list.append(more);
      }
    }
    if (!list.children.length) list.append(h("p", { class: "empty" }, TABS.find((t) => t.key === tab).empty));
    root.append(list);
  }

  function item(v) {
    const del = h("button", { class: "icon-btn", "aria-label": "Archive" }, icon("trash"));
    del.addEventListener("click", () => { v.archived = true; store.save(); render(); });
    const row = h("article", { class: "vitem" + (v.done ? " done" : "") });
    if (v.kind === "task") {
      const cb = h("button", { class: "check" + (v.done ? " on" : ""), "aria-label": v.done ? "Mark not done" : "Mark done", "aria-pressed": String(!!v.done) }, icon("check"));
      cb.addEventListener("click", () => {
        v.done = !v.done;
        const ot = UP.state.oneThing;
        if (ot && ot.vid === v.id) ot.done = v.done;
        v.doneAt = v.done ? now() : null;
        if (v.done && !v.rewarded) {
          v.rewarded = true;
          UP.state.stats.deeds++;
          store.today().deeds++;
          store.questProgress("deed");
          store.award(20, { reason: "To-do done", anchor: cb });
          UP.sfx.done();
          UP.ui.burst(cb, 14);
        }
        store.save();
        setTimeout(render, 250);
      });
      row.append(cb);
    }
    const main = h("div", { class: "vmain" }, h("p", { class: "vtext" }, v.text));
    if (v.step) main.append(h("p", { class: "vstep" }, "First step: " + v.step));
    if (v.body) main.append(h("p", { class: "vstep" }, v.body));
    main.append(h("p", { class: "vmeta" }, timeAgo(v.createdAt)));
    row.append(main);
    if (v.kind === "question" || v.kind === "idea") {
      const ask = h("button", { class: "icon-btn spark needs-ai", "aria-label": v.kind === "question" ? "Ask Claude" : "Get next steps" }, icon("spark"));
      ask.addEventListener("click", () => {
        if (v.kind === "question") UP.ui.claudeSheet("Answer", v.text, (onText, signal) => UP.ai.answer(v.text, onText, signal));
        else UP.ui.claudeSheet("Next steps", v.text, (onText, signal) => UP.ai.expandIdea(v.text, onText, signal));
      });
      row.append(ask);
    }
    row.append(del);
    return row;
  }

  function untangle() {
    const id = "dump-" + Date.now();
    const ta = h("textarea", { id, class: "field", rows: "7", placeholder: "Type everything on your mind, messy is fine. Dentist, mom's birthday gift, why do cats knead, fix bike brakes, start running again...", "aria-label": "Brain dump" });
    const go = h("button", { class: "btn primary wide" }, icon("spark"), "Sort it for me");
    const out = h("div", { class: "untangle-out", "aria-live": "polite" });
    go.addEventListener("click", async () => {
      const text = ta.value.trim();
      if (!text) { ta.focus(); return; }
      go.disabled = true;
      out.textContent = "Claude is sorting your thoughts...";
      try {
        const items = await UP.ai.untangle(text);
        if (!items.length) { out.textContent = "Couldn't find separate items in that. Try listing a few things."; return; }
        out.innerHTML = "";
        const ul = h("ul", { class: "captured" });
        for (const it of items) {
          store.addVault(it.kind, it.text, it.step ? { step: String(it.step).slice(0, 120) } : {});
          ul.append(h("li", null, h("b", null, { task: "To-do", idea: "Idea", question: "Question" }[it.kind] + " "), it.text));
        }
        UP.state.stats.captures += items.length;
        store.questProgress("capture");
        store.award(10 + items.length * 3, { reason: "Untangled", anchor: go });
        out.append(h("p", { class: "hint" }, items.length + " items filed in your vault."), ul);
        ta.value = "";
        render();
      } catch (e) {
        out.textContent = UP.ai.handleError(e) || "Stopped.";
      } finally {
        go.disabled = false;
      }
    });
    UP.ui.closeSheet();
    setTimeout(() => {
      const body = h("div", { class: "compose" }, h("p", { class: "lede" }, "Dump everything on your mind. Claude splits it into to-dos, ideas and questions, and finds the first tiny step for each to-do."), ta, go, out);
      // reuse the generic sheet through compose-like markup
      UP.ui.sheetRaw("Untangle", body);
      setTimeout(() => ta.focus(), 80);
    }, 10);
  }

  UP.vault = { render };
})();

/* ---- src/js/ui.js ---- */
/* Upscroll — shell: feed, HUD, tabs, sheets, effects. */
(function () {
  const UP = window.UP;
  const { $, $$, h, icon, store, engine, bus, sfx, buzz, now, clamp } = UP;
  const S = engine.session;

  const ui = (UP.ui = {});
  let feed, history = [], filter = "mix", current = null, io;
  const pending = []; // specs to insert next

  /* ================= feed ================= */
  function append(spec) {
    const el = UP.cards.render(spec);
    history.push(spec);
    feed.append(el);
    io.observe(el);
    return el;
  }
  function fill(min = 3) {
    const cards = $$(".card", feed);
    const idx = current ? cards.indexOf(current) : 0;
    let ahead = cards.length - 1 - idx;
    while (ahead < min) {
      const spec = pending.length ? pending.shift() : engine.next(history, filter);
      if (spec.key == null) spec.key = UP.uid("c");
      append(spec);
      ahead++;
    }
  }
  ui.insertNext = (spec) => {
    spec.key = UP.uid("c");
    // replace the card right after the current one so it is literally next
    const cards = $$(".card", feed);
    const idx = cards.indexOf(current);
    const el = UP.cards.render(spec);
    if (idx >= 0 && cards[idx + 1]) feed.insertBefore(el, cards[idx + 1]);
    else feed.append(el);
    history.push(spec);
    io.observe(el);
  };
  let kbNav = false;
  ui.advance = () => {
    const cards = $$(".card", feed);
    const idx = cards.indexOf(current);
    const nxt = cards[idx + 1];
    if (nxt) nxt.scrollIntoView({ behavior: UP.reducedMotion() ? "auto" : "smooth", block: "start" });
  };
  function back() {
    const cards = $$(".card", feed);
    const idx = cards.indexOf(current);
    if (idx > 0) cards[idx - 1].scrollIntoView({ behavior: UP.reducedMotion() ? "auto" : "smooth", block: "start" });
  }

  let enteredAt = now();
  function onCurrent(el) {
    if (current === el) return;
    if (current && current._leave) current._leave();
    if (current) {
      const secs = Math.min(120, (now() - enteredAt) / 1000);
      // the feed also learns from how you scroll: instant skips count a little against, lingering a little for
      const ps = current._spec;
      if (ps && !["brief", "chest", "receipt", "one", "review"].includes(ps.kind)) {
        const engaged = current.classList.contains("done");
        if (!engaged && secs < 1.5) store.lean(current._topicKey, ps.kind, -0.15);
        else if (engaged || secs > 8) store.lean(current._topicKey, ps.kind, 0.06);
      }
      UP.state.stats.secs += secs;
      store.today().secs += secs;
    }
    current = el;
    enteredAt = now();
    $$(".card.active", feed).forEach((c) => { c.classList.remove("active"); c.inert = true; });
    el.classList.add("active");
    el.inert = false;
    if (kbNav) { kbNav = false; el.focus({ preventScroll: true }); }
    const spec = el._spec;
    if (!el._counted) {
      el._counted = true;
      S.cards++;
      UP.state.stats.cards++;
      store.today().cards++;
      if (spec.data && spec.data.id === spec.id && !/^[vj]-/.test(spec.id)) UP.state.seen[spec.id] = now();
    }
    const slot = $("#rail-slot");
    if (slot) slot.replaceChildren(...(el._rail ? [el._rail] : []));
    if (el._enter) el._enter();
    fill(5);
    schedulePrune();
    maybeDig();
    hint(false);
    store.save();
  }
  let pruneT;
  function schedulePrune() {
    // never prune mid-scroll: removing cards during a smooth scroll makes the feed jump
    clearTimeout(pruneT);
    pruneT = setTimeout(prune, 900);
  }
  let lastScroll = 0;
  function prune() {
    if (now() - lastScroll < 700) return schedulePrune();
    const cards = $$(".card", feed);
    const idx = cards.indexOf(current);
    if (idx > 40) {
      const drop = cards.slice(0, idx - 30);
      const offset = feed.scrollTop - current.offsetTop;
      drop.forEach((c) => { io.unobserve(c); c.remove(); });
      feed.scrollTop = current.offsetTop + offset;
    }
  }
  function resetFeed() {
    $$(".card", feed).forEach((c) => { io.unobserve(c); c.remove(); });
    history = [];
    current = null;
    fill(3);
    feed.scrollTop = 0;
    const first = $(".card", feed);
    if (first) onCurrent(first);
  }
  ui.resetFeed = resetFeed;

  /* rabbit holes refill as you scroll (each fetch rides on a swipe, never a timer) */
  const holeFails = {}; // id -> {n, at}: back off after failures instead of retrying on every swipe
  function maybeDig() {
    if (!UP.ai.available() || !UP.state.holes.length) return;
    for (const hole of engine.holesNeedingCards()) {
      const f = holeFails[hole.id];
      if (f && now() - f.at < Math.min(30 * 60000, 20000 * Math.pow(2, f.n))) continue;
      UP.ai.digHole(hole).then((cards) => {
        if (cards.length) delete holeFails[hole.id];
        else holeFails[hole.id] = { n: ((f && f.n) || 0) + 1, at: now() };
      }).catch((e) => {
        holeFails[hole.id] = { n: ((f && f.n) || 0) + 1, at: now() };
        const msg = UP.ai.handleError(e);
        if (msg && !maybeDig.warned) { maybeDig.warned = true; ui.toast(msg); }
      });
      break;
    }
  }

  /* ================= HUD ================= */
  function renderHud() {
    const st = UP.state;
    const L = store.levelInfo(st.xp);
    const t = store.today();
    const goal = st.settings.dailyGoal;
    const pct = clamp(t.xp / goal, 0, 1);
    const ringC = 2 * Math.PI * 15;
    $("#goal-ring .fg").style.strokeDashoffset = String(ringC * (1 - pct));
    $("#goal-ring").classList.toggle("full", pct >= 1);
    $("#goal-num").textContent = String(t.xp);
    $("#goal-ring").setAttribute("aria-label", t.xp + " of " + goal + " XP today");
    $("#lvl-num").textContent = String(L.level);
    $("#lvl-title").textContent = L.title;
    $("#lvl-bar i").style.transform = "scaleX(" + L.pct + ")";
    const streak = store.streakAlive();
    $("#streak-num").textContent = String(streak);
    $("#streak").setAttribute("aria-label", "Streak: " + streak + (streak === 1 ? " day" : " days"));
    $("#lvl-bar").setAttribute("aria-valuenow", String(Math.round(L.pct * 100)));
    $("#streak").classList.toggle("lit", st.streak.last === UP.dayKey());
    $("#streak").title = st.streak.last === UP.dayKey() ? "Streak safe today" : "Earn " + store.STREAK_MIN + " XP today to keep your streak";
    const c = st.combo;
    const combo = $("#combo");
    combo.hidden = c < 2;
    combo.textContent = c + "x";
    combo.classList.toggle("hot", c >= 5);
    const boost = $("#boost");
    boost.hidden = !(S.boost > 0);
    boost.textContent = "2x XP · " + (S.boost || 0);
  }
  ui.renderHud = renderHud;

  /* ================= effects ================= */
  let fx, fxc, parts = [], fxRun = false;
  function fxLoop() {
    fxc.clearRect(0, 0, fx.width, fx.height);
    parts = parts.filter((p) => p.life > 0);
    for (const p of parts) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.life -= 1; p.rot += p.vr;
      fxc.globalAlpha = Math.min(1, p.life / 30);
      fxc.fillStyle = p.color;
      fxc.save();
      fxc.translate(p.x, p.y);
      fxc.rotate(p.rot);
      if (p.shape === "dot") { fxc.beginPath(); fxc.arc(0, 0, p.s, 0, 7); fxc.fill(); }
      else fxc.fillRect(-p.s, -p.s / 2.5, p.s * 2, p.s / 1.25);
      fxc.restore();
    }
    fxc.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(fxLoop);
    else fxRun = false;
  }
  function spawn(x, y, n, spread, shape) {
    if (UP.reducedMotion()) return;
    const dpr = window.devicePixelRatio || 1;
    const colors = ["#f6cf6f", "#ffe6a6", "#7ee0cf", "#ff9a8a", "#b9a4ff", "#ffffff"];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (1 + Math.random() * spread) * dpr;
      parts.push({ x: x * dpr, y: y * dpr, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spread * 0.6 * dpr, g: 0.18 * dpr, life: 50 + Math.random() * 40, color: UP.pick(colors), s: (2 + Math.random() * 3) * dpr, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, shape: shape || (Math.random() < 0.5 ? "dot" : "rect") });
    }

  }
  function centerOf(el) {
    if (!el || !el.getBoundingClientRect) return { x: innerWidth / 2, y: innerHeight / 2 };
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  ui.burst = (el, n = 12) => { const c = centerOf(el); spawn(c.x, c.y, n, 3, "dot"); };
  ui.confetti = (el) => { const c = centerOf(el); spawn(c.x, c.y, 70, 7); };

  function floatXP(amount, anchor) {
    const c = centerOf(anchor);
    const f = h("div", { class: "float-xp" }, "+" + amount);
    f.style.left = c.x + "px";
    f.style.top = c.y + "px";
    document.body.append(f);
    setTimeout(() => f.remove(), 1100);
  }

  ui.announce = (text) => {
    const live = $("#sr-live");
    if (!live) return;
    live.textContent = "";
    setTimeout(() => { live.textContent = text; }, 30);
  };
  let toastT;
  ui.toast = (msg) => {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("show"), 2200);
  };

  function banner(kicker, title, sub) {
    const b = h("div", { class: "banner", role: "status" }, h("span", { class: "b-kick" }, kicker), h("strong", null, title), sub ? h("span", { class: "b-sub" }, sub) : null);
    document.body.append(b);
    requestAnimationFrame(() => b.classList.add("show"));
    setTimeout(() => { b.classList.remove("show"); setTimeout(() => b.remove(), 500); }, 2600);
  }

  ui.banner = banner;
  ui.countUp = (el, from, to, unit) => {
    if (UP.reducedMotion()) { el.textContent = UP.fmtNum(to, unit); return; }
