<div id="app">
  <header class="top">
    <div class="brand" aria-label="Upscroll"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">upscroll</span></div>
    <nav class="filters" aria-label="Feed mix">
      <button class="filter on" data-filter="mix" aria-pressed="true">Mix</button>
      <button class="filter" data-filter="learn" aria-pressed="false">Learn</button>
      <button class="filter" data-filter="do" aria-pressed="false">Do</button>
      <button class="filter" data-filter="calm" aria-pressed="false">Calm</button>
    </nav>
    <div class="top-right">
      <button id="holes-btn" class="icon-btn holes-btn" aria-label="Rabbit holes" title="Rabbit holes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="15.5" rx="8" ry="3.5"/><path d="M12 3.5v8M8.5 8l3.5 3.5L15.5 8"/></svg>
      </button>
      <button id="goal-ring" class="goal-ring" type="button" aria-label="Daily goal">
        <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="bg" cx="18" cy="18" r="15"/><circle class="fg" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="94.25"/></svg>
        <span id="goal-num">0</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <h1 class="sr-only">Upscroll</h1>
    <section class="view" data-view="feed" aria-label="Feed">
      <div id="feed" class="feed"></div>
      <div id="rail-slot" class="rail-slot"></div>
      <div id="swipe-hint" class="swipe-hint" hidden><span class="swipe-arrow" aria-hidden="true"></span>Swipe up</div>
    </section>
    <section class="view sky-view" data-view="sky" aria-label="Your sky" hidden>
      <canvas id="sky-canvas" aria-hidden="true"></canvas>
      <div id="sky-panel" class="sky-panel"></div>
    </section>
    <section class="view vault-view" data-view="vault" aria-label="Vault" hidden>
      <div id="vault" class="vault"></div>
    </section>
  </main>

  <footer class="dock">
    <div class="hud">
      <button id="streak" class="streak" title="Streak" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.5 2.6-5.6 3.9-8.8.4 1.9 1.3 3 2.4 3.6.2-2.6 1.4-4.9 3.2-6.6.2 3.1 3.5 5.6 3.5 10.6 0 4.2-2.8 7.4-6.5 7.4z"/></svg>
        <b id="streak-num">0</b>
      </button>
      <div class="lvl">
        <div class="lvl-text"><span class="lvl-n">Lv <b id="lvl-num">1</b></span><span id="lvl-title" class="lvl-title">Spark</span></div>
        <div id="lvl-bar" class="bar" role="progressbar" aria-label="Progress to next level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      </div>
      <span id="combo" class="combo" hidden>2x</span>
      <span id="boost" class="boost" hidden>2x XP</span>
      <button id="capture-btn" class="capture-btn" aria-label="Capture a thought" title="Capture a thought">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab on" data-tab="feed" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 10l3-2.5 3 2.5M9 16.5l3-2.5 3 2.5"/></svg>
        <span>Feed</span>
      </button>
      <button class="tab" data-tab="sky">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="7" r="1.7"/><circle cx="17.5" cy="8.5" r="1.7"/><circle cx="10.5" cy="17.5" r="1.7"/><path d="M8.2 7.3l7.6 1M16.4 10l-4.7 6M7.2 8.6l2.6 7.3"/></svg>
        <span>Sky</span>
      </button>
      <button class="tab" data-tab="vault">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M9.5 13.5h5"/></svg>
        <span>Vault</span>
      </button>
    </nav>
  </footer>
</div>
<div id="onboard" class="onboard" hidden></div>
<div id="session-end" class="onboard session-end" role="dialog" aria-modal="true" aria-label="Session complete" hidden></div>
<canvas id="fx" class="fx" aria-hidden="true"></canvas>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sr-live" class="sr-only" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#eef1fa;background:#0b0f1c">Upscroll needs JavaScript to run.</p></noscript>
